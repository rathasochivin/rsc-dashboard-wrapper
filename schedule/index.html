<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>កាលវិភាគសវនកម្ម</title>
<meta name="theme-color" content="#12283C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="កាលវិភាគ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@font-face{font-family:'KhmerOS Siemreap';src:url('../KhmerOS_siemreap.woff2') format('woff2');font-display:swap}
@font-face{font-family:'KhmerOS Muol Light';src:url('../KhmerOSmuollight.woff2') format('woff2');font-display:swap}
:root{
  --ink:#12283C; --ink2:#1D3A55; --slate:#51677C; --mute:#7E8FA0;
  --paper:#EDF1F4; --card:#FFFFFF; --line:#D8E1E8;
  --seal:#A83226; --go:#17654C; --amber:#A9761A; --focus:#2C6E9B;
  --sh:0 1px 0 rgba(18,40,60,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'KhmerOS Siemreap',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.9; overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'KhmerOS Muol Light','KhmerOS Siemreap',serif;font-weight:400;margin:0;
  font-size:14px;line-height:1.85;letter-spacing:0}
h2,h3{font-size:13.5px;color:var(--ink)}
.lat{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- chrome ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
header.top h1{font-size:13px;letter-spacing:.2px;flex:1;line-height:1.7}
.who{font-size:12px;color:#A9BFD3;text-align:right;line-height:1.4}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3F5B75;margin-right:5px;vertical-align:1px}
.sync.on{background:#4FB286}
main{padding:14px 14px calc(96px + var(--safe-b));max-width:640px;margin:0 auto}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding-bottom:var(--safe-b);
}
nav.tabs button{flex:1;padding:9px 2px 10px;color:var(--mute);font-size:10.5px;line-height:1.4}
nav.tabs button span{display:block;font-size:19px;line-height:1.3}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}

/* ---------- cards ---------- */
.rec{background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.rec .body{display:grid;grid-template-columns:66px 1fr;align-items:stretch}
.rail{
  border-right:3px solid var(--ink);background:#F6F9FB;
  padding:12px 4px;text-align:center;color:var(--ink)
}
.rail.pending{border-right-color:var(--amber)}
.rail.moved{border-right-color:var(--seal)}
.rail.done{border-right-color:var(--go)}
.rail .d{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:26px;font-weight:700;line-height:1.1;display:block}
.rail .m{font-size:11px;color:var(--slate);display:block;margin-top:2px}
.rail .t{font-size:12.5px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink2)}
.rec .meat{padding:12px 13px 13px;min-width:0}
.name{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;font-weight:600;line-height:1.5;word-break:break-word}
.tin{font-size:12.5px;color:var(--slate);margin-top:1px}
.row{display:flex;gap:7px;font-size:13px;color:var(--ink2);margin-top:8px;align-items:flex-start}
.row i{font-style:normal;width:17px;flex:none;text-align:center;opacity:.75}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:2px;border:1px solid;line-height:1.7;margin-left:6px;white-space:nowrap}
.c-plan{color:var(--ink2);border-color:#BCCBD8;background:#F2F6F9}
.c-move{color:var(--seal);border-color:#E3BDB8;background:#FBF2F1}
.c-done{color:var(--go);border-color:#B3D2C6;background:#F0F7F4}
.c-cancel{color:var(--mute);border-color:var(--line);background:#F4F6F8;text-decoration:line-through}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:9px 11px;background:#F6F9FB;border-top:1px solid var(--line)}
.acts button{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:2px;color:var(--ink2)}
.acts button.key{border-color:#B6C7D6;color:var(--ink);font-weight:500}
.acts button.warn{color:var(--seal);border-color:#E3BDB8}
details.hist{border-top:1px solid var(--line);padding:0 13px}
details.hist summary{font-size:12.5px;color:var(--slate);padding:8px 0;cursor:pointer}
details.hist ul{margin:0 0 10px;padding-left:16px;font-size:12.5px;color:var(--slate)}
details.hist li{margin-bottom:5px}

/* ---------- misc ---------- */
.sec{display:flex;align-items:baseline;gap:9px;margin:4px 2px 11px}
.sec h2{font-size:13.5px}
.sec .n{font-size:12px;color:var(--mute)}
.arclink{display:block;width:100%;padding:12px;color:var(--slate);font-size:13px;text-align:center;
  border:1px solid var(--line);background:#fff;border-radius:3px;margin-top:4px}
.add{width:100%;padding:12px;border:1px dashed #B6C7D6;border-radius:3px;background:#fff;color:var(--ink2);font-size:14px;margin-bottom:16px}
.empty{background:#fff;border:1px solid var(--line);border-radius:3px;padding:26px 20px;text-align:center;color:var(--slate);font-size:13.5px}
.empty b{display:block;font-family:'KhmerOS Muol Light',serif;color:var(--ink);font-size:13.5px;margin-bottom:6px;font-weight:400;line-height:1.85}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;font-size:13px;color:var(--slate)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:500}

/* ---------- sheet / forms ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,26,40,.55);z-index:50;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;top:0;z-index:51;background:var(--paper);
  display:none;flex-direction:column
}
.sheet.on{display:flex}
.sheet header{
  background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 11px) 14px 11px;
  display:flex;align-items:center;gap:12px;flex:none
}
.sheet header h2{font-size:13px;flex:1;color:#fff;line-height:1.7}
.sheet header button{color:#B9CCDD;font-size:14px}
.sheet .scroll{flex:1;overflow-y:auto;padding:15px 14px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
label{display:block;font-size:12.5px;color:var(--slate);margin:0 0 4px}
.f{margin-bottom:13px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=time],input[type=datetime-local],input[type=password],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:3px;background:#fff;
}
textarea{min-height:74px;resize:vertical;line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hint{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.6}
.sug{border:1px solid var(--line);border-top:0;background:#fff;max-height:230px;overflow-y:auto;display:none;margin:-13px 0 13px}
.sug.on{display:block}
.sug button{display:block;width:100%;text-align:left;padding:9px 11px;border-bottom:1px solid #EEF2F5}
.sug button:last-child{border-bottom:0}
.sug b{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:13.5px;font-weight:600;line-height:1.5}
.sug span{display:block;color:var(--mute);font-size:12px}
.sug .none{padding:10px 11px;color:var(--mute);font-size:12.5px}
.chip.c-wait{color:var(--amber);border-color:#E2CFA6;background:#FBF6EC}
.chip.c-agree{color:var(--go);border-color:#B3D2C6;background:#F0F7F4}
.chip.c-nore{color:var(--seal);border-color:#E3BDB8;background:#FBF2F1}
.extra{background:#fff;border:1px solid var(--line);border-radius:3px;padding:11px;margin-bottom:9px;position:relative}
.extra .rm{position:absolute;top:6px;right:8px;color:var(--seal);font-size:12.5px}
.mini{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:13px;color:var(--ink2)}
.save{width:100%;padding:14px;background:var(--ink);color:#fff;border-radius:3px;font-size:15px;font-weight:500;margin-top:6px}
.save[disabled]{opacity:.5}
.danger{width:100%;padding:12px;background:#fff;color:var(--seal);border:1px solid #E3BDB8;border-radius:3px;margin-top:10px;font-size:14px}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:none;
  flex-direction:column;justify-content:center;align-items:center;padding:28px 22px;overflow-y:auto}
#login.on{display:flex}
#login .wrap{width:100%;max-width:360px}
#login,#login input,#login button{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#login .mark{width:46px;height:46px;margin-bottom:20px;display:block}
#login h1{font-family:system-ui,-apple-system,sans-serif;font-size:26px;font-weight:600;color:#fff;
  letter-spacing:-.4px;line-height:1.25;margin-bottom:5px}
#login p.sub{color:#8FA8BE;font-size:13.5px;margin:0 0 26px;line-height:1.6}
#login label{color:#8FA8BE;font-size:12px;letter-spacing:.2px;margin-bottom:6px}
#login .fld{position:relative;margin-bottom:14px}
#login input{width:100%;height:50px;padding:0 14px;background:#1A3450;border:1px solid #2E4E6C;
  border-radius:4px;color:#fff;font-size:16px;line-height:50px;-webkit-appearance:none}
#login input::placeholder{color:#6C89A5}
#login input:focus{outline:none;border-color:#6FA8D0;background:#1E3B59}
#login .peek{position:absolute;right:0;top:26px;height:50px;width:52px;color:#8FA8BE;font-size:12.5px}
#login .save{height:50px;width:100%;background:#fff;color:var(--ink);border-radius:4px;
  font-size:15.5px;font-weight:600;margin-top:6px;padding:0}
#login .save[disabled]{opacity:.55}
#login .msg{display:none;margin:16px 0 0;font-size:13px;line-height:1.6;padding:10px 12px;
  border-left:2px solid #E08C82;background:#22405C;color:#F0C4BE}
#login .msg.on{display:block}
#login .msg.ok{border-left-color:#5FB894;color:#BFE3D3}
#login .link{display:block;width:100%;color:#7E9AB4;font-size:12.5px;margin-top:26px;
  text-align:center;text-decoration:underline;padding:8px}
#login .cfg{margin-top:16px;padding-top:16px;border-top:1px solid #2E4E6C}
#login .foot{color:#5D7A94;font-size:11.5px;text-align:center;margin-top:30px;letter-spacing:.3px}

/* ---------- settings ---------- */
.set{background:#fff;border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:12px}
.set h3{font-size:13.5px;margin-bottom:9px}
.set p{margin:0 0 10px;font-size:13px;color:var(--slate);line-height:1.7}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid #EEF2F5}
.kv:last-child{border:0}
.kv span{color:var(--slate)}

/* calendar */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calbar h2{flex:1;font-size:13px;text-align:center;line-height:1.7}
.calbar button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:16px;color:var(--ink2)}
.calbar button.today{width:auto;padding:0 12px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);margin-bottom:14px}
.grid .hd{background:#F2F6F9;text-align:center;font-size:11px;color:var(--slate);padding:6px 0}
.grid .cell{background:#fff;min-height:56px;padding:4px 3px;text-align:center;font-size:12px}
.grid .cell.out{background:#F7F9FB;color:#B9C6D2}
.grid .cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.grid .cell .dn{font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.6}
.grid .cell.tdy .dn{background:var(--ink);color:#fff;border-radius:50%;display:inline-block;width:22px;height:22px;line-height:22px}
.dots{display:flex;justify-content:center;gap:3px;margin-top:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.d-visit{background:var(--ink)} .d-meet{background:var(--focus)} .d-leave{background:var(--go)} .d-late{background:var(--seal)}
.dayhd{font-size:12.5px;color:var(--slate);border-bottom:1px solid var(--line);padding:10px 2px 5px;margin-bottom:8px}
.dayhd.wknd{color:var(--seal)}
.ev{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);padding:9px 11px;margin-bottom:7px;width:100%;text-align:left;align-items:flex-start}
.ev.meet{border-left-color:var(--focus)} .ev.leave{border-left-color:var(--go)} .ev.late{border-left-color:var(--seal)}
.ev .tm{font-family:system-ui,-apple-system,sans-serif;font-size:12.5px;color:var(--slate);width:44px;flex:none;padding-top:1px}
.ev .tx{min-width:0;flex:1}
.ev .tx b{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;line-height:1.5;word-break:break-word}
.ev .tx span{font-size:12.5px;color:var(--slate);display:block;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--slate);margin-bottom:14px}
.legend div{display:flex;align-items:center;gap:5px}

table.rp{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:12.5px;margin-bottom:14px}
table.rp th,table.rp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
#view h2{margin:18px 0 9px}
#view h2:first-child{margin-top:0}
table.rp th{background:#F2F6F9;font-weight:500;color:var(--ink2)}
table.rp td.n,table.rp th.n{text-align:right;font-family:system-ui,-apple-system,sans-serif}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
.sum div{background:#fff;border:1px solid var(--line);padding:11px 12px}
.sum b{display:block;font-family:system-ui,-apple-system,sans-serif;font-size:23px;font-weight:700;line-height:1.2}
.sum span{font-size:12px;color:var(--slate)}
.rphead{font-size:12.5px;color:var(--slate);margin:-4px 0 14px}
@media print{
  header.top,nav.tabs,#toast,.scrim,.sheet,.noprint,#login{display:none!important}
  body{background:#fff;font-size:11.5px}
  main{padding:0;max-width:none}
  .sum div,table.rp{break-inside:avoid}
  @page{size:A4 portrait;margin:14mm}
}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:70;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13.5px;
  max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s
}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1>កាលវិភាគសវនកម្ម</h1>
  <div class="who"><span class="sync" id="syncDot"></span><span id="whoName">—</span></div>
  <button class="gear" id="goSet" aria-label="ការកំណត់">⚙️</button>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="visit" aria-current="page"><span>📍</span>ចុះទីតាំង</button>
  <button data-tab="meet"><span>🤝</span>ប្រជុំ</button>
  <button data-tab="cal"><span>📅</span>ប្រតិទិន</button>
  <button data-tab="team"><span>👥</span>ផ្ទៃក្នុង</button>
  <button data-tab="rep"><span>📊</span>របាយការណ៍</button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <header><h2 id="sheetTitle"></h2><button id="sheetClose">បិទ</button></header>
  <div class="scroll" id="sheetBody"></div>
</section>

<div id="login">
 <div class="wrap">
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="4" y="9" width="40" height="35" rx="3" fill="#ffffff"/>
    <path d="M4 12a3 3 0 0 1 3-3h34a3 3 0 0 1 3 3v6H4z" fill="#A83226"/>
    <rect x="12" y="4" width="4" height="10" rx="2" fill="#EDF1F4"/>
    <rect x="32" y="4" width="4" height="10" rx="2" fill="#EDF1F4"/>
    <rect x="10" y="24" width="9" height="8" rx="1" fill="#12283C"/>
    <rect x="23" y="24" width="7" height="8" rx="1" fill="#C8D5DF"/>
    <rect x="34" y="24" width="7" height="8" rx="1" fill="#C8D5DF"/>
    <rect x="10" y="35" width="9" height="5" rx="1" fill="#C8D5DF"/>
    <rect x="23" y="35" width="7" height="5" rx="1" fill="#C8D5DF"/>
  </svg>
  <h1>Audit Schedule</h1>
  <p class="sub">កាលវិភាគចុះទីតាំង ណាត់ជួបសហគ្រាស និងការជូនដំណឹងផ្ទៃក្នុង</p>

  <label for="loginEmail">Email</label>
  <div class="fld">
    <input type="email" id="loginEmail" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" placeholder="name@gmail.com">
  </div>

  <label for="loginPin">Password</label>
  <div class="fld">
    <input type="password" id="loginPin" autocomplete="current-password" placeholder="••••">
    <button class="peek" id="loginPeek" type="button">បង្ហាញ</button>
  </div>

  <button class="save" id="loginGo">Sign in</button>
  <p class="msg" id="loginMsg"></p>

  <button class="link" id="loginCfg">Server settings</button>
  <div class="cfg" id="loginCfgBox" style="display:none">
    <label for="loginUrl">Apps Script web app URL</label>
    <div class="fld"><input type="url" id="loginUrl" autocapitalize="none" autocorrect="off" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <button class="save" id="loginUrlSave">Save server URL</button>
  </div>

  <div class="foot">RSC · teamsmos.com</div>
 </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   កាលវិភាគសវនកម្ម · RSC
   ការតភ្ជាប់ទៅ Apps Script (Code.gs) ដាក់ក្នុង ⚙️ ការកំណត់
   ============================================================ */
/* ⬇⬇ បំពេញ URL របស់ Apps Script ត្រង់នេះម្តងគត់ មុន upload ទៅ GitHub
   រួចហើយ សមាជិកគ្រប់រូបគ្រាន់តែវាយ email និង password — មិនត្រូវកំណត់អ្វីទៀតទេ */
var API_URL = 'https://script.google.com/macros/s/AKfycbwVmwb-VA-By455ueGTIQp_nWgOpIhfBhM8NIHLBn7tlH-DpTwni3ahWKr3IEWBMXHXSQ/exec';

var ADMIN_EMAIL = 'rathasochivin@gmail.com';
var TEAM = [
  {email:'rathasochivin@gmail.com', name:'Ratha Sochivin', role:'admin'},
  {email:'khoeundenit@gmail.com',   name:'Khoeun Denit',   role:'user'},
  {email:'pichpanhapang@gmail.com', name:'Pich Panhapang', role:'user'}
];

function apiUrl(){ return API_URL || localStorage.getItem(LSK+'apiUrl') || '' }

function api(fn,args){
  var url=apiUrl();
  if(!url) return Promise.reject(new Error('មិនទាន់ភ្ជាប់ម៉ាស៊ីនមេ'));
  if(typeof fetch!=='function') return Promise.reject(new Error('កម្មវិធីរុករកចាស់ពេក សូមប្រើ Chrome ឬ Safari ជំនាន់ថ្មី'));
  return fetch(url,{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   /* simple request — no CORS preflight */
    body:JSON.stringify({fn:fn,args:args||[]})
  }).then(function(r){return r.json()}).then(function(j){
    if(j && j.ok) return j.data;
    throw new Error((j&&j.error)||'ម៉ាស៊ីនមេមិនឆ្លើយតប');
  });
}

function archiveVisit(r){

  pushVisit(r);
}

/* ---------- 1b. calendar ---------- */
function pad2(n){ return (n<10?'0':'')+n }
function dkey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()) }
function keyDate(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]) }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x }

/** រាល់ព្រឹត្តិការណ៍ តម្រៀបតាមថ្ងៃ ៖ {ថ្ងៃ: [ព្រឹត្តិការណ៍…]} */
function calEvents(){
  var map={};
  function put(k,e){ (map[k]=map[k]||[]).push(e) }
  S.visits.forEach(function(r){
    if(r.status==='cancelled' || r.archived) return;
    if(r.visitAt){ var a=dt(r.visitAt); if(a) put(dkey(a),{ord:a.getHours()*60+a.getMinutes(),cls:'visit',ico:'📍',tm:fmtT(r.visitAt),
      title:r.nameLatin||'', sub:'ចុះពិនិត្យទីតាំង'+(r.address?' · '+r.address:''), rec:r}) }
    if(r.meetAt){ var b=dt(r.meetAt); if(b) put(dkey(b),{ord:b.getHours()*60+b.getMinutes(),cls:'meet',ico:'🤝',tm:fmtT(r.meetAt),
      title:r.nameLatin||'', sub:meetPlace(r)+((r.auditors||[]).length?' · '+r.auditors.map(nameOf).join(', '):''), rec:r}) }
  });
  S.internal.forEach(function(r){
    var st=dt(r.fromAt); if(!st) return;
    var tail='';
    if(r.type==='late'){
      put(dkey(st),{ord:st.getHours()*60+st.getMinutes(),cls:'late',ico:'⏰',tm:fmtT(r.fromAt),
        title:nameOf(r.email), sub:'សុំមកយឺត · '+(r.reason||'')+tail});
    }else{
      var en=dt(r.toAt)||st, cur=new Date(st.getFullYear(),st.getMonth(),st.getDate()), guard=0;
      while(cur<=en && guard++<60){
        put(dkey(cur),{ord:-1,cls:'leave',ico:'🏖',tm:'ច្បាប់',
          title:nameOf(r.email), sub:'សុំច្បាប់ · '+(r.reason||'')+tail});
        cur=addDays(cur,1);
      }
    }
  });
  Object.keys(map).forEach(function(k){ map[k].sort(function(a,b){return a.ord-b.ord}) });
  return map;
}

function renderCal(root){
  if(!S.cal) S.cal={mode:'month', k:dkey(new Date())};
  var ev=calEvents(), cur=keyDate(S.cal.k), today=dkey(new Date());

  var seg=el('div','seg');
  [['day','ថ្ងៃ'],['week','សប្តាហ៍'],['month','ខែ']].forEach(function(p){
    var b=el('button',null,p[1]); b.setAttribute('aria-pressed', S.cal.mode===p[0]?'true':'false');
    b.onclick=function(){ S.cal.mode=p[0]; render() }; seg.appendChild(b);
  });
  root.appendChild(seg);

  var step = S.cal.mode==='day'?1:(S.cal.mode==='week'?7:0);
  var bar=el('div','calbar');
  var prev=el('button',null,'‹'), next=el('button',null,'›'), tdy=el('button','today','ថ្ងៃនេះ');
  prev.onclick=function(){ S.cal.k = step? dkey(addDays(cur,-step)) : dkey(new Date(cur.getFullYear(),cur.getMonth()-1,1)); render() };
  next.onclick=function(){ S.cal.k = step? dkey(addDays(cur, step)) : dkey(new Date(cur.getFullYear(),cur.getMonth()+1,1)); render() };
  tdy.onclick=function(){ S.cal.k=today; render() };
  var label;
  if(S.cal.mode==='day')  label='ថ្ងៃ'+DAYS[cur.getDay()]+' '+cur.getDate()+' '+KHM[cur.getMonth()]+' '+cur.getFullYear();
  else if(S.cal.mode==='week'){
    var w0=addDays(cur,-cur.getDay()), w1=addDays(w0,6);
    label = w0.getDate()+(w0.getMonth()!==w1.getMonth()?' '+KHM[w0.getMonth()]:'')+' – '+w1.getDate()+' '+KHM[w1.getMonth()]+' '+w1.getFullYear();
  } else label = KHM[cur.getMonth()]+' '+cur.getFullYear();
  bar.appendChild(prev); bar.appendChild(el('h2',null,label)); bar.appendChild(next); bar.appendChild(tdy);
  root.appendChild(bar);

  var lg=el('div','legend');
  [['d-visit','ចុះទីតាំង'],['d-meet','ណាត់ជួប'],['d-leave','ច្បាប់'],['d-late','យឺត']].forEach(function(p){
    var x=el('div'); var i=el('i'); i.className=p[0]; i.style.width='7px'; i.style.height='7px'; i.style.borderRadius='50%';
    x.appendChild(i); x.appendChild(el('span',null,p[1])); lg.appendChild(x);
  });
  root.appendChild(lg);

  if(S.cal.mode==='month') calMonth(root, cur, ev, today);
  else if(S.cal.mode==='week'){
    var w0=addDays(cur,-cur.getDay());
    for(var i=0;i<7;i++) calDayBlock(root, addDays(w0,i), ev, today, true);
  } else calDayBlock(root, cur, ev, today, false);
}

function calMonth(root, cur, ev, today){
  var g=el('div','grid');
  ['អា','ច','អ','ព','ព្រ','សុ','ស'].forEach(function(d){ g.appendChild(el('div','hd',d)) });
  var first=new Date(cur.getFullYear(),cur.getMonth(),1);
  var start=addDays(first,-first.getDay());
  for(var i=0;i<42;i++){
    var d=addDays(start,i), k=dkey(d), list=ev[k]||[];
    var c=el('button','cell'+(d.getMonth()!==cur.getMonth()?' out':'')+(k===today?' tdy':'')+(k===S.cal.k?' sel':''));
    c.innerHTML='<span class="dn">'+d.getDate()+'</span>';
    if(list.length){
      var seen={}, dd=el('div','dots');
      list.forEach(function(e){ if(seen[e.cls]) return; seen[e.cls]=1; var n=el('i'); n.className='d-'+e.cls; dd.appendChild(n) });
      c.appendChild(dd);
    }
    c.onclick=(function(kk){ return function(){ S.cal.k=kk; S.cal.mode='day'; render(); window.scrollTo(0,0) } })(k);
    g.appendChild(c);
    if(i>=34 && addDays(start,i+1).getMonth()!==cur.getMonth() && d.getMonth()!==cur.getMonth()) break;
  }
  root.appendChild(g);
  var k2=S.cal.k, list2=ev[k2]||[];
  root.appendChild(el('div','dayhd', fmtD(k2+'T00:00')+' · '+list2.length+' ព្រឹត្តិការណ៍'));
  drawEvents(root, list2);
}

function calDayBlock(root, d, ev, today, compact){
  var k=dkey(d), list=ev[k]||[];
  var h=el('div','dayhd'+(d.getDay()===0||d.getDay()===6?' wknd':''),
    'ថ្ងៃ'+DAYS[d.getDay()]+' '+d.getDate()+' '+KHM[d.getMonth()]+(k===today?' · ថ្ងៃនេះ':''));
  root.appendChild(h);
  if(!list.length && compact){ root.appendChild(el('div','hint','—')); return }
  drawEvents(root, list);
  if(!compact){
    var add=el('button','add','+ បន្ថែមកាលវិភាគនៅថ្ងៃនេះ');
    add.onclick=function(){ visitForm(null, k) };
    root.appendChild(add);
  }
}

function drawEvents(root, list){
  if(!list.length){ root.appendChild(el('div','empty','គ្មានកាលវិភាគនៅថ្ងៃនេះ')); return }
  list.forEach(function(e){
    var b=el('button','ev '+e.cls);
    b.innerHTML='<span class="tm">'+esc(e.tm)+'</span><span class="tx"><b>'+e.ico+' '+esc(e.title)+'</b><span>'+esc(e.sub)+'</span></span>';
    if(e.rec) b.onclick=function(){ visitForm(e.rec, null, e.cls==='meet'?'meet':'visit') }; else b.style.cursor='default';
    root.appendChild(b);
  });
}

function monthRange(back){
  var n=new Date(), d=new Date(n.getFullYear(), n.getMonth()-(back||0), 1);
  var e=new Date(d.getFullYear(), d.getMonth()+1, 0);
  var p=function(x){return (x<10?'0':'')+x};
  return {from:d.getFullYear()+'-'+p(d.getMonth()+1)+'-01', to:e.getFullYear()+'-'+p(e.getMonth()+1)+'-'+p(e.getDate())};
}
function inRange(iso,from,to){
  var d=dt(iso); if(!d) return false;
  var t=d.getTime();
  return t>=new Date(from+'T00:00').getTime() && t<=new Date(to+'T23:59:59').getTime();
}

function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"' }
function csvDown(name,rows){
  var txt='\uFEFF'+rows.map(function(r){ return r.map(csvCell).join(',') }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() },1500);
  toast('ទាញយករួច — បើកដោយ Excel');
}

/* ============================================================
   SHEETS (forms)
   ============================================================ */
function openSheet(title, build){
  $('#sheetTitle').textContent=title;
  var b=$('#sheetBody'); b.innerHTML=''; build(b);
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); b.scrollTop=0;
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on') }
$('#sheetClose').onclick=closeSheet; $('#scrim').onclick=closeSheet;

function field(parent,label,node,hint){
  var f=el('div','f'); f.appendChild(el('label',null,label)); f.appendChild(node);
  if(hint) f.appendChild(el('div','hint',hint));
  parent.appendChild(f); return node;
}
function input(type,val,ph){ var i=el('input'); i.type=type; i.value=val||''; if(ph)i.placeholder=ph; return i }
function textarea(val,ph){ var t=el('textarea'); t.value=val||''; if(ph)t.placeholder=ph; return t }

function kindOf(r){ return r.kind || (r.visitAt && !r.meetAt ? 'visit' : (r.meetAt && !r.visitAt ? 'meet' : 'both')) }
function meetPlace(r){
  if(!r.meetAt && r.kind==='visit') return '';
  return MEET_VENUE + (r.meetRoom?' · បន្ទប់ '+r.meetRoom:'') + ' · ជាន់ទី '+(r.meetFloor||MEET_FLOOR);
}

function visitForm(r, seedDay, forceKind){
  var isNew=!r;
  var k0 = forceKind || (r?kindOf(r):'visit');
  r = r ? JSON.parse(JSON.stringify(r)) : {id:uid(), status:'planned', extras:[], auditors:[], history:[], kind:k0, meetFloor:MEET_FLOOR};
  var showSite = isNew ? (k0!=='meet') : (!!r.visitAt || kindOf(r)!=='meet');
  var showMeet = isNew ? (k0==='meet') : (!!r.meetAt  || kindOf(r)==='meet');
  var title = isNew ? (k0==='meet'?'ការប្រជុំសហគ្រាសថ្មី':'ការចុះទីតាំងថ្មី')
                    : (showSite&&showMeet ? 'កែកាលវិភាគ' : (showMeet?'កែការប្រជុំ':'កែការចុះទីតាំង'));
  openSheet(title, function(b){
    var find=field(b,'ស្វែងរកសហគ្រាស ('+S.ents.length+')', input('text','','វាយឈ្មោះឡាតាំង ឬ លេខអតប'));
    var sug=el('div','sug'); b.appendChild(sug);

    var name=field(b,'ឈ្មោះសហគ្រាស (ឡាតាំង)', input('text',r.nameLatin,'ABC (CAMBODIA) CO., LTD.'));
    var tin =field(b,'លេខអតប', input('text',r.tin,'L001-901702836'));

    /* បញ្ជីស្នើ (datalist) ដាក់លើប្រអប់ឈ្មោះ និងលេខអតប */
    var dlN=el('datalist'), dlT=el('datalist');
    dlN.id='dlN'+r.id; dlT.id='dlT'+r.id;
    entSorted().forEach(function(e){
      if(e.nameLatin){ var o=el('option'); o.value=e.nameLatin; dlN.appendChild(o) }
      if(e.tin){ var o2=el('option'); o2.value=e.tin; dlT.appendChild(o2) }
    });
    b.appendChild(dlN); b.appendChild(dlT);
    name.setAttribute('list',dlN.id); tin.setAttribute('list',dlT.id);
    name.setAttribute('autocomplete','off'); tin.setAttribute('autocomplete','off');

    /* ---- ផ្នែកចុះទីតាំង ---- */
    var siteBox=el('div'); b.appendChild(siteBox);
    var addr=field(siteBox,'អាសយដ្ឋានសហគ្រាស', textarea(r.address,'ផ្ទះ… ផ្លូវ… សង្កាត់… ខណ្ឌ… រាជធានីភ្នំពេញ'));
    var map =field(siteBox,'តំណភ្ជាប់ផែនទី (Google Maps)', input('url',r.mapLink,'https://maps.app.goo.gl/…'),'បើកកម្មវិធីផែនទី → Share → Copy link → បិទភ្ជាប់ទីនេះ');
    siteBox.appendChild(el('label',null,'ទីតាំងបន្ថែម (ឃ្លាំង · រោងចក្រ · សាខា)'));
    var wrap=el('div'); siteBox.appendChild(wrap);
    function drawExtras(){
      wrap.innerHTML='';
      (r.extras||[]).forEach(function(x,ix){
        var d=el('div','extra');
        var rm=el('button','rm','លុប'); rm.onclick=function(){ r.extras.splice(ix,1); drawExtras() };
        d.appendChild(rm);
        var l=input('text',x.label,'ឃ្លាំង'); l.oninput=function(){x.label=l.value};
        var a=textarea(x.address,'អាសយដ្ឋាន'); a.oninput=function(){x.address=a.value};
        var m=input('url',x.mapLink,'តំណផែនទី (បើមាន)'); m.oninput=function(){x.mapLink=m.value};
        d.appendChild(l); d.appendChild(el('div','f')); d.appendChild(a); d.appendChild(el('div','f')); d.appendChild(m);
        wrap.appendChild(d);
      });
      var ad=el('button','mini','+ បន្ថែមទីតាំង');
      ad.onclick=function(){ r.extras=r.extras||[]; r.extras.push({label:'ឃ្លាំង',address:'',mapLink:''}); drawExtras() };
      wrap.appendChild(ad); wrap.appendChild(el('div','f'));
    }
    drawExtras();
    var seed = (isNew && seedDay) ? seedDay+'T08:00' : '';
    var seedM = (isNew && seedDay) ? seedDay+'T14:00' : '';
    var visit=field(siteBox,'ថ្ងៃ ខែ ឆ្នាំ និងម៉ោង ចុះពិនិត្យទីតាំង', input('datetime-local',toLocalInput(r.visitAt)||seed));

    /* ---- ផ្នែកណាត់ជួប (GDT TOWER) ---- */
    var meetBox=el('div'); b.appendChild(meetBox);
    meetBox.appendChild(el('div','hint','ទីកន្លែងណាត់ជួប៖ '+MEET_VENUE));
    meetBox.appendChild(el('div','f'));
    var two=el('div','two');
    var roomW=el('div'), floorW=el('div');
    two.appendChild(roomW); two.appendChild(floorW); meetBox.appendChild(two);
    var room =field(roomW ,'បន្ទប់លេខ', input('text',r.meetRoom,'ឧ. 305'));
    var floor=field(floorW,'ជាន់ទី',   input('text',r.meetFloor||MEET_FLOOR,'3'));
    var meet =field(meetBox,'ថ្ងៃ ខែ ឆ្នាំ និងម៉ោង ណាត់ជួបសហគ្រាស', input('datetime-local',toLocalInput(r.meetAt)||seedM));

    siteBox.style.display = showSite ? 'block' : 'none';
    meetBox.style.display = showMeet ? 'block' : 'none';

    function fillFrom(e){
      r.entId=e.id;
      name.value=e.nameLatin||''; tin.value=e.tin||'';
      addr.value=e.address||''; map.value=e.mapLink||'';
      if(e.contactName)  cname.value=e.contactName;
      if(e.contactPhone) cphone.value=e.contactPhone;
      r.extras=JSON.parse(JSON.stringify(e.extras||[])); drawExtras();
      sug.className='sug'; find.value='';
    }
    function matchEnts(q){
      q=String(q||'').trim().toLowerCase();
      var all=entSorted();
      if(!q) return all.slice(0,8);
      return all.filter(function(e){
        return String(e.nameLatin||'').toLowerCase().indexOf(q)>=0 ||
               String(e.tin||'').toLowerCase().indexOf(q)>=0;
      }).slice(0,8);
    }
    function drawSug(){
      var hits=matchEnts(find.value); sug.innerHTML='';
      if(!S.ents.length){ sug.className='sug'; return }
      if(!hits.length){ sug.appendChild(el('div','none','រកមិនឃើញ — វាយបញ្ចូលជាសហគ្រាសថ្មីខាងក្រោម')); sug.className='sug on'; return }
      hits.forEach(function(e){
        var x=el('button');
        x.innerHTML='<b>'+esc(e.nameLatin||'')+'</b><span>'+esc(e.tin||'')+(e.address?' · '+esc(e.address):'')+'</span>';
        x.onclick=function(){ fillFrom(e) };
        sug.appendChild(x);
      });
      sug.className='sug on';
    }
    find.oninput=drawSug;
    find.onfocus=drawSug;
    /* ជ្រើសពី datalist ក៏បំពេញព័ត៌មានដែរ */
    function syncFromTyped(){
      var n=name.value.trim().toLowerCase(), tv=tin.value.trim().toLowerCase(), hit=null;
      S.ents.forEach(function(e){
        if(hit) return;
        if(n && String(e.nameLatin||'').toLowerCase()===n) hit=e;
        else if(tv && String(e.tin||'').toLowerCase()===tv) hit=e;
      });
      if(hit) fillFrom(hit);
    }
    name.onchange=syncFromTyped; tin.onchange=syncFromTyped;

    b.appendChild(el('label',null,'សវនករទទួលបន្ទុក'));
    var picks={};
    TEAM.forEach(function(u){
      var row=el('div','kv');
      var lb=el('label',null,u.name); lb.style.margin='0';
      var cb=el('input'); cb.type='checkbox'; cb.checked=(r.auditors||[]).indexOf(u.email)>=0; cb.style.width='20px'; cb.style.height='20px';
      picks[u.email]=cb; row.appendChild(lb); row.appendChild(cb); b.appendChild(row);
    });
    b.appendChild(el('div','f'));
    var two2=el('div','two'), cnW=el('div'), cpW=el('div');
    two2.appendChild(cnW); two2.appendChild(cpW); b.appendChild(two2);
    var cname=field(cnW,'អ្នកតំណាងសហគ្រាស', input('text',r.contactName,'ឈ្មោះ'));
    var cphone=field(cpW,'លេខទូរសព្ទ', input('tel',r.contactPhone,'012 345 678'));

    var resp=el('select');
    RESP.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; resp.appendChild(o) });
    resp.value=r.resp||'waiting';
    field(b,'ការឆ្លើយតបរបស់សហគ្រាស',resp);

    var via=el('select');
    NOTICE.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; via.appendChild(o) });
    via.value=r.noticeVia||'';
    field(b,'លិខិតជូនដំណឹង ផ្ញើតាមរយៈ',via);
    var ndate=field(b,'ថ្ងៃ ខែ ឆ្នាំ ផ្ញើ / ទទួលលិខិត', input('date',r.noticeDate||''));

    var note=field(b,'កំណត់សម្គាល់', textarea(r.note,'ឯកសារត្រូវត្រៀម · អ្នកទំនាក់ទំនង · លេខទូរសព្ទ…'));

    var go=el('button','save',isNew?'រក្សាទុក និងជូនដំណឹងក្រុម':'រក្សាទុកការកែប្រែ');
    go.onclick=function(){
      if(!name.value.trim()) return toast('សូមបញ្ចូលឈ្មោះសហគ្រាស');
      r.kind = (showSite&&showMeet) ? 'both' : (showMeet?'meet':'visit');
      r.nameLatin=name.value.trim(); r.tin=tin.value.trim(); r.note=note.value.trim();
      r.address=addr.value.trim(); r.mapLink=map.value.trim();
      r.visitAt = showSite ? fromLocalInput(visit.value) : '';
      r.meetAt  = showMeet ? fromLocalInput(meet.value)  : '';
      r.meetRoom  = showMeet ? room.value.trim() : '';
      r.meetFloor = showMeet ? (floor.value.trim()||MEET_FLOOR) : '';
      r.contactName=cname.value.trim(); r.contactPhone=cphone.value.trim();
      r.resp=resp.value; r.noticeVia=via.value; r.noticeDate=ndate.value;
      r.auditors=Object.keys(picks).filter(function(e){return picks[e].checked});
      r.extras=(r.extras||[]).filter(function(x){return (x.address||'').trim()||(x.label||'').trim()});
      if(!r.visitAt && !r.meetAt) return toast('សូមកំណត់ថ្ងៃ និងម៉ោង');
      r.updatedAt=new Date().toISOString();
      if(isNew){ r.createdBy=S.me.email; r.createdAt=r.updatedAt;
        r.history=[{at:r.updatedAt,by:S.me.email,text:'បង្កើតកាលវិភាគ'}]; }
      else { r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,text:'កែព័ត៌មានកាលវិភាគ'}]) }

      var known=null, i;
      for(i=0;i<S.ents.length;i++){
        var e=S.ents[i];
        if(e.id===r.entId || (r.tin && String(e.tin).trim()===r.tin) ||
           String(e.nameLatin||'').trim().toLowerCase()===r.nameLatin.toLowerCase()) { known=e; break }
      }
      var ent = known || {id:'e'+uid().slice(1)};
      ent.nameLatin=r.nameLatin; ent.tin=r.tin;
      if(r.address) ent.address=r.address;
      if(r.mapLink) ent.mapLink=r.mapLink;
      if((r.extras||[]).length) ent.extras=JSON.parse(JSON.stringify(r.extras));
      if(r.contactName)  ent.contactName=r.contactName;
      if(r.contactPhone) ent.contactPhone=r.contactPhone;
      ent.updatedAt=r.updatedAt; ent.updatedBy=S.me.email;
      r.entId=ent.id;
      pushEnt(ent);

      closeSheet(); pushVisit(r);
    };
    b.appendChild(go);

    if(!isNew){
      var del=el('button','danger','លុបកាលវិភាគនេះ');
      del.onclick=function(){
        if(!confirm('លុបកាលវិភាគ «'+r.nameLatin+'» មែនទេ?')) return;
        closeSheet();
        if(!online()){ S.visits=S.visits.filter(function(x){return x.id!==r.id}); saveLocal(); render(); return }
        api('apiDeleteVisit',[S.token,r.id]).then(function(){return refresh(true)}).then(function(){toast('លុបរួច')}).catch(function(e){toast('⚠️ '+e.message)});
      };
      b.appendChild(del);
    }
  });
}

function respForm(r){
  openSheet('ការឆ្លើយតបរបស់សហគ្រាស', function(b){
    b.appendChild(el('div','hint','សហគ្រាស៖ '+r.nameLatin));
    b.appendChild(el('div','f'));
    RESP.forEach(function(p){
      var x=el('button','add', p[1]);
      x.style.textAlign='left'; x.style.borderStyle='solid';
      if((r.resp||'waiting')===p[0]){ x.style.borderColor='var(--ink)'; x.style.fontWeight='500' }
      x.onclick=function(){
        if((r.resp||'waiting')===p[0]) return closeSheet();
        var old=labOf(RESP,r.resp||'waiting');
        r.resp=p[0]; r.updatedAt=new Date().toISOString();
        r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,text:'ការឆ្លើយតប៖ '+old+' → '+p[1]}]);
        closeSheet(); pushVisit(r);
      };
      b.appendChild(x);
    });

    b.appendChild(el('label',null,'លិខិតជូនដំណឹង'));
    var via=el('select');
    NOTICE.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; via.appendChild(o) });
    via.value=r.noticeVia||'';
    field(b,'ផ្ញើតាមរយៈ',via);
    var nd=field(b,'ថ្ងៃ ខែ ឆ្នាំ ផ្ញើ / ទទួល', input('date',r.noticeDate||''));
    var sv=el('button','save','រក្សាទុកលិខិតជូនដំណឹង');
    sv.onclick=function(){
      r.noticeVia=via.value; r.noticeDate=nd.value;
      r.updatedAt=new Date().toISOString();
      r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,
        text:'លិខិតជូនដំណឹង៖ '+labOf(NOTICE,r.noticeVia)+(r.noticeDate?' · '+fmtD(r.noticeDate+'T00:00'):'')}]);
      closeSheet(); pushVisit(r);
    };
    b.appendChild(sv);
  });
}

function moveForm(r){
  openSheet('ប្តូរថ្ងៃ ខែ ម៉ោង', function(b){
    b.appendChild(el('div','hint','សហគ្រាស៖ '+r.nameLatin));
    b.appendChild(el('div','f'));
    var which=el('select'), opts=[];
    if(r.visitAt) opts.push(['visit','ចុះពិនិត្យទីតាំង']);
    if(r.meetAt)  opts.push(['meet','ណាត់ជួបសហគ្រាស']);
    if(r.visitAt && r.meetAt) opts.push(['both','ទាំងពីរ']);
    opts.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; which.appendChild(o) });
    field(b,'ប្តូរអ្វី',which);
    var nv=input('datetime-local',toLocalInput(r.visitAt)), nm=input('datetime-local',toLocalInput(r.meetAt));
    if(r.visitAt) field(b,'ពេលថ្មី៖ ចុះពិនិត្យទីតាំង', nv);
    if(r.meetAt)  field(b,'ពេលថ្មី៖ ណាត់ជួបសហគ្រាស ('+MEET_VENUE+')', nm);
    var rs=el('select'); REASONS.forEach(function(t){ rs.appendChild(el('option',null,t)) });
    field(b,'មូលហេតុ',rs);
    var note=field(b,'ពន្យល់បន្ថែម', textarea('','ឧ. សហគ្រាសសុំពន្យារ ១ សប្តាហ៍ ដោយគណនេយ្យករឈប់សម្រាក'));

    var go=el('button','save','រក្សាទុក និងជូនដំណឹងក្រុម');
    go.onclick=function(){
      var w=which.value, old={v:r.visitAt,m:r.meetAt}, txt=[];
      if(w==='visit'||w==='both'){ r.visitAt=fromLocalInput(nv.value); txt.push('ចុះទីតាំង៖ '+fmtFull(old.v)+' → '+fmtFull(r.visitAt)) }
      if(w==='meet' ||w==='both'){ r.meetAt =fromLocalInput(nm.value); txt.push('ណាត់ជួប៖ '+fmtFull(old.m)+' → '+fmtFull(r.meetAt)) }
      r.moved=true; r.status = r.status==='done'?'done':'planned';
      r.updatedAt=new Date().toISOString();
      r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,text:'ប្តូរពេល ('+rs.value+') · '+txt.join(' | ')+(note.value?' · '+note.value:'')}]);
      r.lastReason=rs.value+(note.value?' · '+note.value:'');
      closeSheet(); pushVisit(r);
    };
    b.appendChild(go);
  });
}

function internalForm(type){
  openSheet(type==='late'?'សុំមកយឺត':'សុំច្បាប់', function(b){
    var rec={id:uid(), type:type, email:S.me.email, status:'noted', createdAt:new Date().toISOString()};
    var from, to, days;
    if(type==='late'){
      from=field(b,'ថ្ងៃ និងម៉ោងគ្រោងមកដល់', input('datetime-local',toLocalInput(new Date().toISOString())));
    }else{
      from=field(b,'ចាប់ពីថ្ងៃ', input('date',''));
      to  =field(b,'ដល់ថ្ងៃ', input('date',''),'បើសុំតែមួយថ្ងៃ ដាក់ថ្ងៃដដែល');
    }
    var rs=el('select');
    (type==='late'
      ? ['ជាប់ការងារផ្ទាល់ខ្លួន','បញ្ហាចរាចរណ៍','មិនស្រួលខ្លួន','ការងារខាងក្រៅមុនចូល','ហេតុផលផ្សេងៗ']
      : ['ឈឺ','បញ្ហាគ្រួសារ','ការងារផ្ទាល់ខ្លួន','ច្បាប់ប្រចាំឆ្នាំ','ហេតុផលផ្សេងៗ']
    ).forEach(function(t){ rs.appendChild(el('option',null,t)) });
    field(b,'មូលហេតុ',rs);
    var note=field(b,'ពន្យល់បន្ថែម', textarea('',''));
    var go=el('button','save','ផ្ញើការជូនដំណឹង');
    go.onclick=function(){
      if(!from.value) return toast('សូមជ្រើសរើសថ្ងៃ');
      if(type==='late'){ rec.fromAt=fromLocalInput(from.value); rec.toAt=rec.fromAt; rec.days=0 }
      else{
        rec.fromAt=new Date(from.value+'T08:00').toISOString();
        rec.toAt = new Date((to.value||from.value)+'T17:00').toISOString();
        rec.days = Math.round((new Date(to.value||from.value)-new Date(from.value))/864e5)+1;
      }
      rec.reason=rs.value+(note.value?' · '+note.value:'');
      closeSheet(); pushInternal(rec);
    };
    b.appendChild(go);
  });
}

/* ============================================================
   ការជូនដំណឹង · ប្រតិទិន
   ============================================================ */
function notify(title,body){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title,{body:body,icon:'./icon-192.png',badge:'./icon-192.png'}) })
        .catch(function(){ new Notification(title,{body:body}) });
    } else new Notification(title,{body:body});
  }catch(e){}
}
/* ១. ការផ្លាស់ប្តូរថ្មីពីសមាជិកផ្សេង */
function checkNew(){
  var seen=ls('seen')||{}, fresh=[];
  S.visits.forEach(function(r){
    if(seen[r.id]!==r.updatedAt && r.updatedAt){
      if(seen[r.id]) fresh.push('🕒 '+r.nameLatin+' — កាលវិភាគមានការផ្លាស់ប្តូរ');
      else if(Object.keys(seen).length) fresh.push('📍 '+r.nameLatin+' — កាលវិភាគថ្មី');
      seen[r.id]=r.updatedAt;
    }
  });
  S.internal.forEach(function(r){
    var k=r.id+'|'+r.status;
    if(!seen[k]){ if(Object.keys(seen).length) fresh.push((r.type==='late'?'⏰ ':'🏖 ')+nameOf(r.email)+' — '+(r.type==='late'?'សុំមកយឺត':'សុំច្បាប់')); seen[k]=1 }
  });
  ls('seen',seen);
  if(fresh.length===1) notify('កាលវិភាគសវនកម្ម',fresh[0]);
  else if(fresh.length>1) notify('កាលវិភាគសវនកម្ម','មានបច្ចុប្បន្នភាព '+fresh.length+' ក្នុងកាលវិភាគ');
}
/* ២. រំលឹកមុនម៉ោង */
function checkReminders(){
  if(window.__native) return;              /* native build: ប្រព័ន្ធទូរសព្ទរំលឹកជំនួស */
  var done=ls('reminded')||{}, now=Date.now(), changed=false;
  S.visits.forEach(function(r){
    if(r.status==='done'||r.status==='cancelled') return;
    [['visitAt','ចុះពិនិត្យទីតាំង'],['meetAt','ណាត់ជួបសហគ្រាស']].forEach(function(p){
      var t=dt(r[p[0]]); if(!t) return;
      [[864e5,'ថ្ងៃស្អែក'],[36e5,'ក្នុងរយៈពេល ១ ម៉ោង']].forEach(function(w){
        var key=r.id+'|'+p[0]+'|'+w[0];
        var diff=t.getTime()-now;
        if(diff>0 && diff<=w[0] && !done[key]){
          notify(p[1]+' '+w[1], r.nameLatin+' · '+fmtFull(r[p[0]])+(r.address?'\n'+r.address:''));
          done[key]=1; changed=true;
        }
      });
    });
  });
  if(changed) ls('reminded',done);
}
/* ៣. ដាក់ចូលប្រតិទិនទូរសព្ទ (.ics) — ជូនដំណឹងដំណើរការទោះកម្មវិធីបិទ */
function icsTime(iso){ return new Date(iso).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z' }
function downloadICS(r){
  var evs=[];
  function ev(when,label,where){
    if(!when) return;
    var end=new Date(new Date(when).getTime()+2*36e5).toISOString();
    evs.push(['BEGIN:VEVENT','UID:'+r.id+label+'@rsc','DTSTAMP:'+icsTime(new Date().toISOString()),
      'DTSTART:'+icsTime(when),'DTEND:'+icsTime(end),
      'SUMMARY:'+label+' · '+(r.nameLatin||''),
      'LOCATION:'+(String(where||'').replace(/[\r\n]+/g,' ')),
      'DESCRIPTION:អតប '+(r.tin||'')+'\\n'+(r.mapLink||'')+'\\n'+(r.note||''),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:'+label,'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+label,'END:VALARM',
      'END:VEVENT'].join('\r\n'));
  }
  ev(r.visitAt,'ចុះពិនិត្យទីតាំង', r.address||''); ev(r.meetAt,'ណាត់ជួបសហគ្រាស', meetPlace(r));
  if(!evs.length) return toast('មិនទាន់មានថ្ងៃ ម៉ោង');
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RSC//Schedule//KM','CALSCALE:GREGORIAN'].concat(evs).concat(['END:VCALENDAR']).join('\r\n');
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(r.nameLatin||'schedule').replace(/[^\w\- ]+/g,'_')+'.ics';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() },1500);
  toast('បើកឯកសារនេះ ដើម្បីដាក់ចូលប្រតិទិនទូរសព្ទ');
}

/* ============================================================
   LOGIN + BOOT
   ============================================================ */
function lmsg(txt,ok){
  var m=$('#loginMsg'); m.textContent=txt||'';
  m.className='msg'+(txt?' on':'')+(ok?' ok':'');
}
function drawLogin(){
  var box=$('#loginCfgBox'), go=$('#loginGo');
  $('#loginUrl').value=apiUrl();
  $('#loginCfg').onclick=function(){ box.style.display = box.style.display==='none'?'block':'none' };
  $('#loginUrlSave').onclick=function(){
    var u=$('#loginUrl').value.trim();
    localStorage.setItem(LSK+'apiUrl',u);
    if(!u){ lmsg('Server URL cleared.'); return }
    lmsg('Checking server…', true);
    api('apiPing',[]).then(function(){ lmsg('Server connected. You can sign in now.', true); box.style.display='none' })
      .catch(function(e){ lmsg(e.message) });
  };
  if(API_URL){ $('#loginCfg').style.display='none'; box.style.display='none' }
  else if(!apiUrl()) box.style.display='block';
  var peek=$('#loginPeek');
  peek.onclick=function(){
    var i=$('#loginPin'), hid=i.type==='password';
    i.type = hid?'text':'password'; peek.textContent = hid?'លាក់':'បង្ហាញ'; i.focus();
  };
  go.onclick=function(){
    var email=($('#loginEmail').value||'').trim().toLowerCase(), pw=$('#loginPin').value||'';
    if(!email || !pw) return lmsg('Enter your email and password.');
    if(!apiUrl()){ box.style.display='block'; return lmsg('Add the server URL below first.') }
    lmsg('Signing in…', true); go.disabled=true; go.textContent='Signing in…';
    api('apiLogin',[email,pw]).then(function(d){
      S.token=d.token; localStorage.setItem(LSK+'token',d.token);
      $('#loginPin').value=''; lmsg('');
      setMe({email:email, name:d.name, role:d.role});
    }).catch(function(e){ lmsg(e.message) })
      .then(function(){ go.disabled=false; go.textContent='Sign in' });
  };
  $('#loginEmail').onkeydown=$('#loginPin').onkeydown=function(e){ if(e.key==='Enter') $('#loginGo').click() };
  $('#login').classList.add('on');
}
function setMe(me){
  S.me=me; ls('me',me); $('#login').classList.remove('on');
  if(window.__native) window.__native.push(me.email);
  render(); refresh(true).then(checkReminders);
}
window.__refreshNow=function(){ if(S.me) refresh(true) };
function boot(){
  S.token=localStorage.getItem(LSK+'token')||null;
  var me=ls('me');
  loadLocal();
  if(me && me.email){ setMe(me) } else { drawLogin() }
  var tabs=document.querySelectorAll('nav.tabs button');
  for(var i=0;i<tabs.length;i++) tabs[i].onclick=(function(t){ return function(){ S.tab=t; render(); window.scrollTo(0,0) } })(tabs[i].dataset.tab);
  $('#goSet').onclick=function(){ S.tab='set'; render(); window.scrollTo(0,0) };
  markSync(false);
  if(online()) api('apiPing',[]).then(function(){markSync(true)}).catch(function(){});
  setInterval(function(){ if(!document.hidden){ refresh(true); checkReminders() } }, 60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ refresh(true); checkReminders() } });
  var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if(!native && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});
}
boot();
