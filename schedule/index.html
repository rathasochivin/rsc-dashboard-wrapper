    function fillFrom(e){
      r.entId=e.id;
      /* សវនករ និងដៃគូដែលកំណត់ក្នុងបញ្ជីសហគ្រាស — បំពេញចូលស្វ័យប្រវត្តិ */
      if(e.auditor) aSel.value=e.auditor;
      pSel.value=e.partner||'';
      name.value=e.nameLatin||''; tin.value=e.tin||'';
      addr.value=e.address||''; map.value=e.mapLink||'';
      if(e.contactName)  cname.value=e.contactName;
      if(e.contactPhone) cphone.value=e.contactPhone;
      pSel.value=e.partner||'';
      r.extras=JSON.parse(JSON.stringify(e.extras||[])); drawExtras();
      sug.className='sug'; find.value='';
    }
    function matchEnts(q){
      q=String(q||'').trim().toLowerCase();
      var all=entSorted().filter(function(e){ return ownsEnt(e,fowner) });
      if(!q) return all;
      return all.filter(function(e){
        return String(e.nameLatin||'').toLowerCase().indexOf(q)>=0 ||
               String(e.tin||'').toLowerCase().indexOf(q)>=0;
      });
    }
    function drawSug(){
      var hits=matchEnts(find.value); sug.innerHTML='';
      if(!S.ents.length){ sug.className='sug'; return }
      if(!hits.length){ sug.appendChild(el('div','none','រកមិនឃើញ — វាយបញ្ចូលជាសហគ្រាសថ្មីខាងក្រោម')); sug.className='sug on'; return }
      hits.forEach(function(e){
        var x=el('button');
        x.innerHTML='<b>'+esc(e.nameLatin||'')+'</b><span>'+esc(e.tin||'')+(e.address?' · '+esc(e.address):'')+'</span>';
        x.onclick=function(){ fillFrom(e) };
        sug.appendChild(x);
      });
      sug.className='sug on';
    }
    find.oninput=drawSug;
    find.onfocus=drawSug;
    /* ជ្រើសពី datalist ក៏បំពេញព័ត៌មានដែរ */
    function syncFromTyped(){
      var n=name.value.trim().toLowerCase(), tv=tin.value.trim().toLowerCase(), hit=null;
      S.ents.forEach(function(e){
        if(hit) return;
        if(n && String(e.nameLatin||'').toLowerCase()===n) hit=e;
        else if(tv && String(e.tin||'').toLowerCase()===tv) hit=e;
      });
      if(hit) fillFrom(hit);
    }
    name.onchange=syncFromTyped; tin.onchange=syncFromTyped;

    var two3=el('div','two'), aW=el('div'), pW=el('div');
    two3.appendChild(aW); two3.appendChild(pW); b.appendChild(two3);
    var aSel=el('select'), pSel=el('select');
    aSel.appendChild(el('option',null,'— ជ្រើសរើស —')).value='';
    pSel.appendChild(el('option',null,'— គ្មាន —')).value='';
    TEAM.forEach(function(u){
      var o1=el('option',null,u.name); o1.value=u.email; aSel.appendChild(o1);
      var o2=el('option',null,u.name); o2.value=u.email; pSel.appendChild(o2);
    });
    aSel.value=(r.auditors&&r.auditors[0])||'';
    pSel.value=r.partner||(r.auditors&&r.auditors[1])||'';
    field(aW,'សវនករទទួលបន្ទុក',aSel);
    field(pW,'ដៃគូ',pSel);

    var two2=el('div','two'), cnW=el('div'), cpW=el('div');
    two2.appendChild(cnW); two2.appendChild(cpW); b.appendChild(two2);
    var cname=field(cnW,'អ្នកតំណាងសហគ្រាស', input('text',r.contactName,'ឈ្មោះ'));
    var cphone=field(cpW,'លេខទូរសព្ទ', input('tel',r.contactPhone,'012 345 678'));

    var resp=el('select');
    RESP.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; resp.appendChild(o) });
    resp.value=r.resp||'waiting';
    field(b,'ការឆ្លើយតបរបស់សហគ្រាស',resp);

    var notices = noticesOf(r).map(function(n){ return JSON.parse(JSON.stringify(n)) });
    b.appendChild(el('label',null,'លិខិតជូនដំណឹង (ផ្ញើបានច្រើនផ្លូវ)'));
    var nBox=el('div'); b.appendChild(nBox);
    function drawNotices(){
      nBox.innerHTML='';
      notices.forEach(function(n,ix){
        var card=el('div','extra');
        var rm=el('button','rm','លុប');
        rm.onclick=function(){ notices.splice(ix,1); drawNotices() };
        card.appendChild(rm);

        var via=el('select');
        NOTICE.forEach(function(p){ if(p[0]==='') return; var o=el('option',null,p[1]); o.value=p[0]; via.appendChild(o) });
        via.value=n.via||'telegram'; n.via=via.value;
        via.onchange=function(){ n.via=via.value; toggleWho() };
        field(card,'ផ្ញើតាមរយៈ',via);

        var dt2=input('date', n.date||'');
        dt2.onchange=function(){ n.date=dt2.value };
        field(card,'ថ្ងៃ ខែ ឆ្នាំ ផ្ញើ / ទទួល',dt2);

        var who=el('div'); card.appendChild(who);
        var nm=input('text', n.name||'', 'ឈ្មោះអ្នកទទួល');
        nm.oninput=function(){ n.name=nm.value };
        var ph=input('tel', n.phone||'', '012 345 678');
        ph.oninput=function(){ n.phone=ph.value };
        field(who,'ឈ្មោះអ្នកទទួល',nm);
        field(who,'លេខទូរសព្ទអ្នកទទួល',ph);
        function toggleWho(){ who.style.display=(NOTICE_WHO.indexOf(n.via)>=0)?'block':'none' }
        toggleWho();

        n.imgs = (n.imgs && n.imgs.length!==undefined) ? n.imgs : (n.img?[n.img]:[]);
        imageList(card, n.imgs, function(a){ n.imgs=a }, 'ឯកសារភ្ជាប់');
        nBox.appendChild(card);
      });
      var add=el('button','mini','+ បន្ថែមការផ្ញើលិខិត');
      add.onclick=function(){ notices.push({via:'telegram',date:'',name:'',phone:'',imgs:[]}); drawNotices() };
      nBox.appendChild(add); nBox.appendChild(el('div','f'));
    }
    drawNotices();

    var note=field(b,'កំណត់សម្គាល់', textarea(r.note,'ឯកសារត្រូវត្រៀម · អ្នកទំនាក់ទំនង · លេខទូរសព្ទ…'));
    if(seedEnt) fillFrom(seedEnt);

    var go=el('button','save',isNew?'រក្សាទុក និងជូនដំណឹងក្រុម':'រក្សាទុកការកែប្រែ');
    go.onclick=function(){
      if(!name.value.trim()) return toast('សូមបញ្ចូលឈ្មោះសហគ្រាស');
      r.kind = (showSite&&showMeet) ? 'both' : (showMeet?'meet':'visit');
      r.nameLatin=name.value.trim(); r.tin=tin.value.trim(); r.note=note.value.trim();
      r.address=addr.value.trim(); r.mapLink=map.value.trim();
      r.visitAt = showSite ? visit.val() : '';
      r.meetAt  = showMeet ? meet.val()  : '';
      /* វិនាទីមិនរាប់ ៖ ពេលដដែល កុំឱ្យរាប់ជាការប្តូរពេល (និងកុំផ្ញើសារ) */
      var sameMin=function(a,b){
        var x=dt(a), y=dt(b);
        return !!x && !!y && Math.floor(x.getTime()/60000)===Math.floor(y.getTime()/60000);
      };
      if(before && sameMin(before.visitAt, r.visitAt)) r.visitAt=before.visitAt;
      if(before && sameMin(before.meetAt,  r.meetAt))  r.meetAt =before.meetAt;
      r.meetRoom  = showMeet ? room.value.trim() : '';
      r.zoomLink  = showMeet ? zoom.value.trim() : '';
      if(!showMeet) r.bookingImg='';
      if(showMeet && !r.round){
        var kk=r.entId||r.nameLatin;
        r.round = S.visits.filter(function(x){ return x.meetAt && x.id!==r.id && (x.entId||x.nameLatin)===kk }).length + 1;
      }
      r.meetFloor = showMeet ? (floor.value.trim()||MEET_FLOOR) : '';
      r.contactName=cname.value.trim(); r.contactPhone=cphone.value.trim();
      r.area = (area.value.trim() || guessArea(addr.value));
      r.resp=resp.value;
      r.notices=notices.filter(function(n){ return n.via });
      var n0=r.notices[0]||{};
      r.noticeVia=n0.via||''; r.noticeDate=n0.date||'';
      r.noticeName=n0.name||''; r.noticePhone=n0.phone||'';
      r.noticeImg=(n0.imgs&&n0.imgs[0])||'';
      r.partner = (pSel.value && pSel.value!==aSel.value) ? pSel.value : '';
      r.auditors=[aSel.value, r.partner].filter(function(x,i,a){ return x && a.indexOf(x)===i });
      r.extras=(r.extras||[]).filter(function(x){return (x.address||'').trim()||(x.label||'').trim()});
      if(!r.visitAt && !r.meetAt) return toast('សូមកំណត់ថ្ងៃ និងម៉ោង');
      r.updatedAt=new Date().toISOString();
      if(isNew){ r.createdBy=S.me.email; r.createdAt=r.updatedAt;
        r.history=[{at:r.updatedAt,by:S.me.email,text:'បង្កើតកាលវិភាគ'}]; }
      else {
        var FIELDS=[['nameLatin','ឈ្មោះសហគ្រាស'],['tin','លេខអតប'],['address','អាសយដ្ឋាន'],['mapLink','តំណផែនទី'],
          ['area','តំបន់'],['visitAt','ថ្ងៃចុះទីតាំង'],['meetAt','ថ្ងៃណាត់ជួប'],['meetRoom','បន្ទប់'],
          ['meetFloor','ជាន់ទី'],['zoomLink','តំណ Zoom'],['contactName','អ្នកតំណាង'],['contactPhone','លេខទូរសព្ទ'],
          ['resp','ការឆ្លើយតប'],['note','កំណត់សម្គាល់'],['partner','ដៃគូ']];
        var ch=[];
        FIELDS.forEach(function(f){
          var k=f[0];
          var b0=(before&&before[k])||'', n0=r[k]||'';
          if(k==='resp'){ b0=(before&&before.resp)||'waiting'; n0=r.resp||'waiting' }
          if(k==='area' && !(before&&before.area)) return;      /* តំបន់ដែលកម្មវិធីទាញឯង មិនរាប់ជាការកែ */
          if(String(b0)!==String(n0)) ch.push(f[1]);
        });
        if(String((before&&before.auditors||[]).join(','))!==String(r.auditors.join(','))) ch.push('សវនករ');
        if(JSON.stringify((before&&before.notices)||noticesOf(before||{}))!==JSON.stringify(r.notices)) ch.push('លិខិតជូនដំណឹង');
        if(JSON.stringify((before&&before.siteImgs)||[])!==JSON.stringify(r.siteImgs||[])) ch.push('រូបទីតាំង');
        if(JSON.stringify((before&&before.extras)||[])!==JSON.stringify(r.extras||[])) ch.push('ទីតាំងបន្ថែម');
        r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,
          text: ch.length ? ('កែ៖ '+ch.join(' · ')) : 'រក្សាទុកឡើងវិញ'}]);
      }

      var known=null, i;
      for(i=0;i<S.ents.length;i++){
        var e=S.ents[i];
        if(e.id===r.entId || (r.tin && String(e.tin).trim()===r.tin) ||
           String(e.nameLatin||'').trim().toLowerCase()===r.nameLatin.toLowerCase()) { known=e; break }
      }
      var ent = known || {id:'e'+uid().slice(1)};
      ent.nameLatin=r.nameLatin; ent.tin=r.tin;
      if(r.address) ent.address=r.address;
      if(r.mapLink) ent.mapLink=r.mapLink;
      if((r.extras||[]).length) ent.extras=JSON.parse(JSON.stringify(r.extras));
      if(r.contactName)  ent.contactName=r.contactName;
      if(r.contactPhone) ent.contactPhone=r.contactPhone;
      if(aSel.value) ent.auditor=aSel.value;
      ent.partner=r.partner||'';
      ent.updatedAt=r.updatedAt; ent.updatedBy=S.me.email;
      r.entId=ent.id;
      pushEnt(ent);

      closeSheet(); pushVisit(r);
    };
    b.appendChild(go);

    if(!isNew){
      b.appendChild(el('div','f'));
      if(r.status!=='done'){
        var dn=el('button','mini','✔️ សម្គាល់ថាបានចុះរួច');
        dn.style.display='block'; dn.style.width='100%'; dn.style.marginBottom='8px';
        dn.onclick=function(){
          r.status='done'; r.updatedAt=new Date().toISOString();
          closeSheet(); pushVisit(r);
        };
        b.appendChild(dn);
      }
      var ar=el('button','mini', r.archived?'↩️ យកចេញពីប័ណ្ណសារ':'📦 បញ្ចប់សវនកម្ម & ដាក់ប័ណ្ណសារ');
      ar.style.display='block'; ar.style.width='100%'; ar.style.marginBottom='10px';
      ar.onclick=function(){ closeSheet(); archiveVisit(r) };
      b.appendChild(ar);

      var del=el('button','danger','លុបកាលវិភាគនេះ');
      del.onclick=function(){
        if(!confirm('លុបកាលវិភាគ «'+r.nameLatin+'» មែនទេ?')) return;
        closeSheet();
        if(!online()){ S.visits=S.visits.filter(function(x){return x.id!==r.id}); saveLocal(); render(); return }
        api('apiDeleteVisit',[S.token,r.id]).then(function(){return refresh(true)}).then(function(){toast('លុបរួច')}).catch(function(e){toast('⚠️ '+e.message)});
      };
      b.appendChild(del);
    }
  });
}

function respForm(r){
  openSheet('ការឆ្លើយតបរបស់សហគ្រាស', function(b){
    b.appendChild(el('div','hint','សហគ្រាស៖ '+r.nameLatin));
    b.appendChild(el('div','f'));
    RESP.forEach(function(p){
      var x=el('button','add', p[1]);
      x.style.textAlign='left'; x.style.borderStyle='solid';
      if((r.resp||'waiting')===p[0]){ x.style.borderColor='var(--ink)'; x.style.fontWeight='500' }
      x.onclick=function(){
        if((r.resp||'waiting')===p[0]) return closeSheet();
        var old=labOf(RESP,r.resp||'waiting');
        r.resp=p[0]; r.updatedAt=new Date().toISOString();
        r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,text:'ការឆ្លើយតប៖ '+old+' → '+p[1]}]);
        closeSheet(); pushVisit(r);
      };
      b.appendChild(x);
    });

    b.appendChild(el('label',null,'លិខិតជូនដំណឹង'));
    var via=el('select');
    NOTICE.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; via.appendChild(o) });
    via.value=r.noticeVia||'';
    field(b,'ផ្ញើតាមរយៈ',via);
    var nd=field(b,'ថ្ងៃ ខែ ឆ្នាំ ផ្ញើ / ទទួល', input('date',r.noticeDate||''));

    var who=el('div');
    b.appendChild(who);
    var nName=field(who,'ឈ្មោះអ្នកទទួល', input('text',r.noticeName,'ឈ្មោះ'));
    var nPhone=field(who,'លេខទូរសព្ទអ្នកទទួល', input('tel',r.noticePhone,'012 345 678'));
    function toggleWho(){
      who.style.display = (NOTICE_WHO.indexOf(via.value)>=0) ? 'block' : 'none';
    }
    via.onchange=toggleWho; toggleWho();

    r.notices = noticesOf(r);
    var n0 = r.notices[0] || {};
    n0.imgs = (n0.imgs && n0.imgs.length!==undefined) ? n0.imgs : (n0.img?[n0.img]:[]);
    imageList(b, n0.imgs, function(a){ n0.imgs=a }, 'ឯកសារភ្ជាប់ (screenshot ឬរូបលិខិត)');

    var sv=el('button','save','រក្សាទុកលិខិតជូនដំណឹង');
    sv.onclick=function(){
      r.noticeVia=via.value; r.noticeDate=nd.value;
      r.noticeName=nName.value.trim(); r.noticePhone=nPhone.value.trim();
      n0.via=r.noticeVia; n0.date=r.noticeDate; n0.name=r.noticeName; n0.phone=r.noticePhone;
      r.noticeImg=(n0.imgs&&n0.imgs[0])||'';
      r.notices = r.noticeVia ? [n0].concat(r.notices.slice(1)) : r.notices.slice(1);
      if(NOTICE_WHO.indexOf(r.noticeVia)>=0 && !r.noticeName)
        return toast('សូមបំពេញឈ្មោះអ្នកទទួល');
      r.updatedAt=new Date().toISOString();
      r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,
        text:'លិខិតជូនដំណឹង៖ '+labOf(NOTICE,r.noticeVia)+(r.noticeDate?' · '+fmtD(r.noticeDate+'T00:00'):'')+
             (r.noticeName?' · '+r.noticeName:'')}]);
      closeSheet(); pushVisit(r);
    };
    b.appendChild(sv);
  });
}

function moveForm(r){
  openSheet('ប្តូរថ្ងៃ ខែ ម៉ោង', function(b){
    b.appendChild(el('div','hint','សហគ្រាស៖ '+r.nameLatin));
    b.appendChild(el('div','f'));
    var which=el('select'), opts=[];
    if(r.visitAt) opts.push(['visit','ចុះពិនិត្យទីតាំង']);
    if(r.meetAt)  opts.push(['meet','ណាត់ជួបសហគ្រាស']);
    if(r.visitAt && r.meetAt) opts.push(['both','ទាំងពីរ']);
    opts.forEach(function(p){ var o=el('option',null,p[1]); o.value=p[0]; which.appendChild(o) });
    field(b,'ប្តូរអ្វី',which);
    var nv=null, nm=null;
    if(r.visitAt) nv=dtField(b,'ពេលថ្មី៖ ចុះពិនិត្យទីតាំង', r.visitAt);
    if(r.meetAt)  nm=dtField(b,'ពេលថ្មី៖ ណាត់ជួប ('+MEET_VENUE+')', r.meetAt);
    var rs=el('select'); REASONS.forEach(function(t){ rs.appendChild(el('option',null,t)) });
    field(b,'មូលហេតុ',rs);
    var note=field(b,'ពន្យល់បន្ថែម', textarea('','ឧ. សហគ្រាសសុំពន្យារ ១ សប្តាហ៍ ដោយគណនេយ្យករឈប់សម្រាក'));

    var go=el('button','save','រក្សាទុក និងជូនដំណឹងក្រុម');
    go.onclick=function(){
      var w=which.value, old={v:r.visitAt,m:r.meetAt}, txt=[];
      if((w==='visit'||w==='both') && nv){ r.prevVisitAt=old.v; r.visitAt=nv.val(); txt.push('ចុះទីតាំង៖ '+fmtFull(old.v)+' → '+fmtFull(r.visitAt)) }
      if((w==='meet' ||w==='both') && nm){ r.prevMeetAt =old.m; r.meetAt =nm.val(); txt.push('ណាត់ជួប៖ '+fmtFull(old.m)+' → '+fmtFull(r.meetAt)) }
      r.moved=true; r.status = r.status==='done'?'done':'planned';
      r.updatedAt=new Date().toISOString();
      r.history=(r.history||[]).concat([{at:r.updatedAt,by:S.me.email,text:'ប្តូរពេល ('+rs.value+') · '+txt.join(' | ')+(note.value?' · '+note.value:'')}]);
      r.lastReason=rs.value+(note.value?' · '+note.value:'');
      closeSheet(); pushVisit(r);
    };
    b.appendChild(go);
  });
}

function internalForm(type, edit){
  if(type==='meeting') return meetingForm(edit);
  if(type==='daily')   return dailyForm(edit);
  openSheet(type==='late'?'សុំមកយឺត':'សុំច្បាប់', function(b){
    var rec={id:uid(), type:type, email:S.me.email, status:'noted', createdAt:new Date().toISOString()};
    var from, to, days;
    if(type==='late'){
      from=field(b,'ថ្ងៃ និងម៉ោងគ្រោងមកដល់', input('datetime-local',toLocalInput(new Date().toISOString())));
    }else{
      from=field(b,'ចាប់ពីថ្ងៃ', input('date',''));
      to  =field(b,'ដល់ថ្ងៃ', input('date',''),'បើសុំតែមួយថ្ងៃ ដាក់ថ្ងៃដដែល');
    }
    var rs=el('select');
    (type==='late'
      ? ['ជាប់ការងារផ្ទាល់ខ្លួន','បញ្ហាចរាចរណ៍','មិនស្រួលខ្លួន','ការងារខាងក្រៅមុនចូល','ហេតុផលផ្សេងៗ']
      : ['ឈឺ','បញ្ហាគ្រួសារ','ការងារផ្ទាល់ខ្លួន','ច្បាប់ប្រចាំឆ្នាំ','ហេតុផលផ្សេងៗ']
    ).forEach(function(t){ rs.appendChild(el('option',null,t)) });
    field(b,'មូលហេតុ',rs);
    var note=field(b,'ពន្យល់បន្ថែម', textarea('',''));
    var go=el('button','save','ផ្ញើការជូនដំណឹង');
    go.onclick=function(){
      if(!from.value) return toast('សូមជ្រើសរើសថ្ងៃ');
      if(type==='late'){ rec.fromAt=fromLocalInput(from.value); rec.toAt=rec.fromAt; rec.days=0 }
      else{
        rec.fromAt=new Date(from.value+'T08:00').toISOString();
        rec.toAt = new Date((to.value||from.value)+'T17:00').toISOString();
        rec.days = Math.round((new Date(to.value||from.value)-new Date(from.value))/864e5)+1;
      }
      rec.reason=rs.value+(note.value?' · '+note.value:'');
      closeSheet(); pushInternal(rec);
    };
    b.appendChild(go);
  });
}

function dailyForm(edit, seedDay){
  var isNew=!edit;
  var r = edit ? JSON.parse(JSON.stringify(edit))
              : {id:uid(), type:'daily', email:S.me.email, status:'noted', createdAt:new Date().toISOString()};
  openSheet(isNew?'របាយការណ៍ប្រចាំថ្ងៃ':'កែរបាយការណ៍ប្រចាំថ្ងៃ', function(b){
    var fowner = (S.formOwner===undefined?S.me.email:S.formOwner);
    var oSel=el('select');
    [['','ទាំងអស់']].concat(TEAM.map(function(u){ return [u.email, u.email===S.me.email?'របស់ខ្ញុំ':u.name] }))
      .forEach(function(pp){ var o=el('option',null,pp[1]); o.value=pp[0]; oSel.appendChild(o) });
    oSel.value=fowner;
    field(b,'បង្ហាញសហគ្រាសរបស់',oSel);

    var eSel=el('select');
    function fillEnts(){
      eSel.innerHTML='';
      eSel.appendChild(el('option',null,'— គ្មានសហគ្រាស (ការងារផ្ទៃក្នុង) —')).value='';
      entSorted().filter(function(e){ return ownsEnt(e,fowner) }).forEach(function(e){
        var o=el('option',null,(e.nameLatin||'')+(e.tin?' · '+e.tin:''));
        o.value=e.id; eSel.appendChild(o);
      });
      eSel.value=r.entId||'';
    }
    fillEnts();
    oSel.onchange=function(){ fowner=oSel.value; S.formOwner=fowner; fillEnts(); drawActs() };
    field(b,'សហគ្រាស',eSel);

    var aSel=el('select');
    function drawActs(){
      var e=null;
      for(var i=0;i<S.ents.length;i++) if(S.ents[i].id===eSel.value) e=S.ents[i];
      var rel = relOfEnt(e);
      aSel.innerHTML='';
      allActs().forEach(function(t){
        var lab = rel ? (t+'ជាមួយ'+rel) : t;
        var o=el('option',null,lab); o.value=lab; aSel.appendChild(o);
      });
      var plus=el('option',null,'➕ បន្ថែមសកម្មភាពថ្មី…'); plus.value='__new'; aSel.appendChild(plus);
      if(r.activity){
        var hit='';
        for(var j=0;j<aSel.options.length;j++){
          var ov=aSel.options[j].value;
          if(ov===r.activity){ hit=ov; break }
          if(ov!=='__new' && baseAct(ov)===baseAct(r.activity)) hit=ov;   /* ដដែល តែពាក្យទំនាក់ទំនងផ្សេង */
        }
        if(!hit){ var o2=el('option',null,r.activity); o2.value=r.activity; aSel.appendChild(o2); hit=r.activity }
        aSel.value=hit; r.activity=hit;
      }
    }
    drawActs();
    eSel.onchange=drawActs;
    aSel.onchange=function(){
      if(aSel.value!=='__new') return;
      var txt=prompt('សកម្មភាពថ្មី៖');
      if(txt && txt.trim()){ r.activity=addAct(txt.trim()); drawActs(); aSel.value=r.activity }
      else { r.activity=''; drawActs() }
    };
    field(b,'សកម្មភាព',aSel);

    var when=field(b,'ថ្ងៃ ខែ ឆ្នាំ និងម៉ោង',
      input('datetime-local', toLocalInput(r.fromAt) || (seedDay?seedDay+'T08:00':toLocalInput(new Date().toISOString()))));
    var cont=field(b,'ខ្លឹមសារ', textarea(r.subject,'អ្វីដែលបានធ្វើ'));
    var res =field(b,'លទ្ធផលកិច្ចប្រជុំ', textarea(r.minutes,'លទ្ធផល និងជំហានបន្ទាប់'));

    var go=el('button','save','រក្សាទុក');
    go.onclick=function(){
      if(!when.value) return toast('សូមកំណត់ថ្ងៃ និងម៉ោង');
      if(aSel.value==='__new') return toast('សូមជ្រើសរើសសកម្មភាព');
      var e=null;
      for(var i=0;i<S.ents.length;i++) if(S.ents[i].id===eSel.value) e=S.ents[i];
      r.entId=eSel.value; r.entName=e?e.nameLatin:'';
      r.activity=aSel.value;
      r.fromAt=fromLocalInput(when.value); r.toAt=r.fromAt;
      r.subject=cont.value.trim(); r.minutes=res.value.trim();
      r.reason=r.activity;
      closeSheet(); pushInternal(r);
    };
    b.appendChild(go);
    if(!isNew){
      var del=el('button','danger','លុបរបាយការណ៍នេះ');
      del.onclick=function(){ closeSheet(); delInternal(r) };
      b.appendChild(del);
    }
  });
}

/* ---------- របាយការណ៍សរុប ប្រចាំសប្តាហ៍ / ខែ ---------- */
function summaryForm(){
  openSheet('របាយការណ៍សរុប', function(b){
    var seg=el('div','seg'), mode=(S.sumMode||'week');
    [['week','ប្រចាំសប្តាហ៍'],['month','ប្រចាំខែ']].forEach(function(p){
      var x=el('button',null,p[1]); x.type='button';
      x.setAttribute('aria-pressed', mode===p[0]?'true':'false');
      x.onclick=function(){ S.sumMode=p[0]; closeSheet(); summaryForm() };
      seg.appendChild(x);
    });
    b.appendChild(seg);

    var now=new Date(), from, to;
    if(mode==='week'){ from=addDays(now,-now.getDay()); to=addDays(from,6) }
    else { from=new Date(now.getFullYear(),now.getMonth(),1); to=new Date(now.getFullYear(),now.getMonth()+1,0) }
    var fk=dkey(from), tk=dkey(to);
    b.appendChild(el('div','rphead', fmtD(fk+'T00:00')+' ដល់ '+fmtD(tk+'T00:00')));

    var base=S.internal.filter(function(r){ return r.type==='daily' && inRange(r.fromAt,fk,tk) })
                       .sort(function(a,b){ return (dt(a.fromAt)||0)-(dt(b.fromAt)||0) });

    var who=el('select');
    [['','សវនករទាំងអស់']].concat(TEAM.map(function(u){ return [u.email,u.name] }))
      .forEach(function(pp){ var o=el('option',null,pp[1]); o.value=pp[0]; who.appendChild(o) });
    who.value=S.sumWho||'';
    var ent=el('select');
    var names={}; base.forEach(function(r){ if(r.entName) names[r.entName]=1 });
    ent.appendChild(el('option',null,'សហគ្រាសទាំងអស់')).value='';
    if(base.some(function(r){ return !r.entName })) ent.appendChild(el('option',null,'(ការងារផ្ទៃក្នុង)')).value='__none';
    Object.keys(names).sort().forEach(function(n){ var o=el('option',null,n); o.value=n; ent.appendChild(o) });
    ent.value=S.sumEnt||'';
    var fw=el('div','two'), w1=el('div'), w2=el('div');
    fw.appendChild(w1); fw.appendChild(w2); b.appendChild(fw);
    field(w1,'សវនករ',who); field(w2,'សហគ្រាស',ent);
    who.onchange=function(){ S.sumWho=who.value; closeSheet(); summaryForm() };
    ent.onchange=function(){ S.sumEnt=ent.value; closeSheet(); summaryForm() };

    var rows=base.filter(function(r){
      var okEnt = !S.sumEnt || (S.sumEnt==='__none' ? !r.entName : r.entName===S.sumEnt);
      return (!S.sumWho || r.email===S.sumWho) && okEnt;
    });
    var byAct={}, actOrder=[];
    rows.forEach(function(r){ var a=baseAct(r.activity)||'—'; if(!byAct[a]){byAct[a]=0; actOrder.push(a)} byAct[a]++ });
    actOrder.sort(function(a,b){ return byAct[b]-byAct[a] || a.localeCompare(b) });
    var sm=el('div','sum');
    var cells=[[rows.length,'របាយការណ៍សរុប']].concat(actOrder.map(function(a){ return [byAct[a],a] }));
    cells.forEach(function(p){ var d=el('div'); d.appendChild(el('b',null,String(p[0]))); d.appendChild(el('span',null,p[1])); sm.appendChild(d) });
    b.appendChild(sm);

    var t=el('table','rp');
    t.innerHTML='<tr><th>ថ្ងៃ</th><th>សវនករ</th><th>សហគ្រាស</th><th>សកម្មភាព</th><th>លទ្ធផល</th></tr>';
    rows.forEach(function(r){
      var tr=el('tr');
      tr.innerHTML='<td>'+fmtD(r.fromAt)+' '+fmtT(r.fromAt)+'</td><td>'+esc(nameOf(r.email))+'</td>'+
        '<td>'+esc(r.entName||'')+'</td><td>'+esc(r.activity||'')+(r.withWho?'<br>'+esc(r.withWho):'')+'</td>'+
        '<td>'+esc(r.minutes||'')+'</td>';
      t.appendChild(tr);
    });
    b.appendChild(t);
    if(!rows.length) b.appendChild(el('div','hint','គ្មានរបាយការណ៍ក្នុងចន្លោះពេលនេះ'));

    var dl=el('button','save','⬇️ ទាញជា Excel');
    dl.onclick=function(){
      var sh=[['ថ្ងៃ','ម៉ោង','សវនករ','សហគ្រាស','សកម្មភាព','ជាមួយអ្នកណា','ខ្លឹមសារ','លទ្ធផល']];
      rows.forEach(function(r){
        sh.push([fmtD(r.fromAt), fmtT(r.fromAt), nameOf(r.email), r.entName||'', r.activity||'',
                 r.withWho||'', r.subject||'', r.minutes||'']);
      });
      xlsxDownload('robeykar_'+fk+'_'+tk+'.xlsx', [{name:'របាយការណ៍ប្រចាំថ្ងៃ', rows:sh}]);
    };
    b.appendChild(dl);
  });
}

function meetingForm(edit){
  var isNew=!edit;
  var r = edit ? JSON.parse(JSON.stringify(edit))
              : {id:uid(), type:'meeting', email:S.me.email, status:'noted',
                 createdAt:new Date().toISOString(), attendees:[], agenda:['']};
  openSheet(isNew?'ប្រជុំផ្ទៃក្នុងថ្មី':'ប្រជុំផ្ទៃក្នុង', function(b){
    var chair=el('select');
    chair.appendChild(el('option',null,'— ជ្រើសរើស —')).value='';
    CHAIRS.forEach(function(t){ var o=el('option',null,t); o.value=t; chair.appendChild(o) });
    chair.value=r.chair||'';
    field(b,'ដឹកនាំការប្រជុំ',chair);

    var when=dtField(b,'ថ្ងៃប្រជុំ', r.fromAt);
    var subj=field(b,'កម្មវត្ថុ', textarea(r.subject,'ខ្លឹមសារសង្ខេបនៃការប្រជុំ'));

    var two=el('div','two'), fW=el('div'), rW=el('div');
    two.appendChild(fW); two.appendChild(rW); b.appendChild(two);
    var floor=field(fW,'ជាន់ទី', input('text',r.floor,'3'));
    var room =field(rW,'បន្ទប់ប្រជុំ', input('text',r.room,'ឧ. 305'));

    var chosen=(r.attendees||[]).slice();
    var aSel=el('select'), aChips=el('div','picked');
    function drawAtt(){
      aSel.innerHTML='';
      aSel.appendChild(el('option',null,'— បន្ថែមអ្នកចូលរួម —')).value='';
      if(chosen.length<TEAM.length) aSel.appendChild(el('option',null,'➕ សវនករទាំងអស់')).value='__all';
      TEAM.forEach(function(u){ if(chosen.indexOf(u.email)<0){ var o=el('option',null,u.name); o.value=u.email; aSel.appendChild(o) } });
      aSel.value='';
      aChips.innerHTML='';
      if(!chosen.length) aChips.appendChild(el('span','none','មិនទាន់ជ្រើសរើស'));
      chosen.forEach(function(em,ix){
        var t=el('span',null,nameOf(em));
        var x=el('button',null,'✕'); x.onclick=function(){ chosen.splice(ix,1); drawAtt() };
        t.appendChild(x); aChips.appendChild(t);
      });
    }
    aSel.onchange=function(){
      if(!aSel.value) return;
      if(aSel.value==='__all'){ TEAM.forEach(function(u){ if(chosen.indexOf(u.email)<0) chosen.push(u.email) }) }
      else chosen.push(aSel.value);
      drawAtt();
    };
    field(b,'សវនករចូលរួមប្រជុំ',aSel);
    b.appendChild(aChips); b.appendChild(el('div','f'));
    drawAtt();

    b.appendChild(el('h3',null,'កត់ត្រាក្រោយប្រជុំ'));
    b.appendChild(el('div','hint','ផ្នែកនេះមិនរួមក្នុងសារជូនដំណឹងទេ — បំពេញក្រោយពេលប្រជុំរួច។'));
    b.appendChild(el('div','f'));

    b.appendChild(el('label',null,'រៀបវារៈការប្រជុំ'));
    var agWrap=el('div'); b.appendChild(agWrap);
    var agenda=(r.agenda||[]).slice(); if(!agenda.length) agenda=[''];
    function drawAg(){
      agWrap.innerHTML='';
      agenda.forEach(function(v,ix){
        var row=el('div','extra');
        var rm=el('button','rm','លុប'); rm.onclick=function(){ agenda.splice(ix,1); if(!agenda.length) agenda=['']; drawAg() };
        row.appendChild(rm);
        var i=input('text',v,'រៀបវារៈទី '+(ix+1));
        i.oninput=function(){ agenda[ix]=i.value };
        row.appendChild(i); agWrap.appendChild(row);
      });
      var ad=el('button','mini','+ បន្ថែមរៀបវារៈ');
      ad.onclick=function(){ agenda.push(''); drawAg() };
      agWrap.appendChild(ad); agWrap.appendChild(el('div','f'));
    }
    drawAg();
    var mins=field(b,'ខ្លឹមសារ / កំណត់ហេតុ', textarea(r.minutes,'សេចក្តីសម្រេច និងចំណុចសំខាន់ៗ'));
    mins.style.minHeight='140px';

    function collect(){
      if(!when.d.value){ toast('សូមកំណត់ថ្ងៃ និងម៉ោងប្រជុំ'); return false }
      if(!chair.value){ toast('សូមជ្រើសរើសអ្នកដឹកនាំការប្រជុំ'); return false }
      return true;
    }
    var go=el('button','save','📣 រក្សាទុក និងជូនដំណឹងក្រុម');
    go.onclick=function(){
      if(!when.d.value) return toast('សូមកំណត់ថ្ងៃ និងម៉ោងប្រជុំ');
      if(!chair.value) return toast('សូមជ្រើសរើសអ្នកដឹកនាំការប្រជុំ');
      r.chair=chair.value; r.fromAt=when.val(); r.toAt=r.fromAt;
      r.subject=subj.value.trim(); r.floor=floor.value.trim(); r.room=room.value.trim();
      r.attendees=chosen.slice();
      r.agenda=agenda.map(function(x){return String(x||'').trim()}).filter(Boolean);
      r.minutes=mins.value.trim();
      r.reason=r.subject;
      r.silent=false;
      closeSheet(); pushInternal(r);
    };
    b.appendChild(go);

    var quiet=el('button','mini','🔕 រក្សាទុកដោយមិនជូនដំណឹង');
    quiet.style.display='block'; quiet.style.width='100%'; quiet.style.marginTop='8px';
    quiet.onclick=function(){
      if(!collect()) return;
      r.chair=chair.value; r.fromAt=when.val(); r.toAt=r.fromAt;
      r.subject=subj.value.trim(); r.floor=floor.value.trim(); r.room=room.value.trim();
      r.attendees=chosen.slice();
      r.agenda=agenda.map(function(x){return String(x||'').trim()}).filter(Boolean);
      r.minutes=mins.value.trim(); r.reason=r.subject; r.silent=true;
      closeSheet(); pushInternal(r);
    };
    b.appendChild(quiet);
  });
}

/* ============================================================
   ការជូនដំណឹង · ប្រតិទិន
   ============================================================ */
function notify(title,body){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title,{body:body,icon:'./icon-192.png',badge:'./icon-192.png'}) })
        .catch(function(){ new Notification(title,{body:body}) });
    } else new Notification(title,{body:body});
  }catch(e){}
}
/* ១. ការផ្លាស់ប្តូរថ្មីពីសមាជិកផ្សេង */
function checkNew(){
  var seen=ls('seen')||{}, fresh=[];
  S.visits.forEach(function(r){
    if(seen[r.id]!==r.updatedAt && r.updatedAt){
      if(seen[r.id]) fresh.push('🕒 '+r.nameLatin+' — កាលវិភាគមានការផ្លាស់ប្តូរ');
      else if(Object.keys(seen).length) fresh.push('📍 '+r.nameLatin+' — កាលវិភាគថ្មី');
      seen[r.id]=r.updatedAt;
    }
  });
  S.internal.forEach(function(r){
    var k=r.id+'|'+r.status;
    if(!seen[k]){ if(Object.keys(seen).length) fresh.push((r.type==='late'?'⏰ ':'🏖 ')+nameOf(r.email)+' — '+(r.type==='late'?'សុំមកយឺត':'សុំច្បាប់')); seen[k]=1 }
  });
  ls('seen',seen);
  if(fresh.length===1) notify('កាលវិភាគសវនកម្ម',fresh[0]);
  else if(fresh.length>1) notify('កាលវិភាគសវនកម្ម','មានបច្ចុប្បន្នភាព '+fresh.length+' ក្នុងកាលវិភាគ');
}
/* ២. រំលឹកមុនម៉ោង */
function leadText(min){
  for(var i=0;i<LEAD_CHOICES.length;i++) if(LEAD_CHOICES[i][0]===min) return LEAD_CHOICES[i][1];
  if(min%1440===0) return (min/1440)+' ថ្ងៃមុន';
  if(min%60===0)   return (min/60)+' ម៉ោងមុន';
  return min+' នាទីមុន';
}
function checkReminders(){
  if(window.__native) return;              /* native build: ប្រព័ន្ធទូរសព្ទរំលឹកជំនួស */
  var done=ls('reminded')||{}, now=Date.now(), changed=false;
  var leads={ visit:leadsFor('visit'), meet:leadsFor('meet') };
  S.visits.forEach(function(r){
    if(r.status==='done'||r.status==='cancelled'||r.archived) return;
    [['visitAt','ចុះពិនិត្យទីតាំង','visit'],['meetAt','ណាត់ជួបសហគ្រាស','meet']].forEach(function(p){
      var t=dt(r[p[0]]); if(!t) return;
      var diff=t.getTime()-now;
      if(diff<=0) return;
      /* បើពេលនៅជិត ការរំលឹកវែងជាងលែងចាំបាច់ — ផ្ញើតែមួយដងជិតបំផុត */
      var hit=leads[p[2]].filter(function(min){ return diff<=min*60000 })
                         .sort(function(a,b){ return a-b });
      if(!hit.length) return;
      var use=hit[0], key=r.id+'|'+p[0]+'|'+use;
      if(!done[key]){
        notify(p[1]+' — '+leadText(use),
          (r.nameLatin||'')+' · '+fmtFull(r[p[0]])+(p[2]==='meet'?'\n'+meetPlace(r):(r.address?'\n'+r.address:'')));
        changed=true;
      }
      hit.forEach(function(min){ done[r.id+'|'+p[0]+'|'+min]=1 });
    });
  });
  if(changed) ls('reminded',done);
}
/* ៣. ដាក់ចូលប្រតិទិនទូរសព្ទ (.ics) — ជូនដំណឹងដំណើរការទោះកម្មវិធីបិទ */
function icsTime(iso){ return new Date(iso).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z' }
function downloadICS(r){
  var evs=[];
  function ev(when,label,where){
    if(!when) return;
    var end=new Date(new Date(when).getTime()+2*36e5).toISOString();
    evs.push(['BEGIN:VEVENT','UID:'+r.id+label+'@rsc','DTSTAMP:'+icsTime(new Date().toISOString()),
      'DTSTART:'+icsTime(when),'DTEND:'+icsTime(end),
      'SUMMARY:'+label+' · '+(r.nameLatin||''),
      'LOCATION:'+(String(where||'').replace(/[\r\n]+/g,' ')),
      'DESCRIPTION:អតប '+(r.tin||'')+'\\n'+(r.mapLink||'')+'\\n'+(r.note||''),
      'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:'+label,'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+label,'END:VALARM',
      'END:VEVENT'].join('\r\n'));
  }
  ev(r.visitAt,'ចុះពិនិត្យទីតាំង', r.address||''); ev(r.meetAt,'ណាត់ជួបសហគ្រាស', meetPlace(r));
  if(!evs.length) return toast('មិនទាន់មានថ្ងៃ ម៉ោង');
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RSC//Schedule//KM','CALSCALE:GREGORIAN'].concat(evs).concat(['END:VCALENDAR']).join('\r\n');
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(r.nameLatin||'schedule').replace(/[^\w\- ]+/g,'_')+'.ics';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() },1500);
  toast('បើកឯកសារនេះ ដើម្បីដាក់ចូលប្រតិទិនទូរសព្ទ');
}

/* ============================================================
   LOGIN + BOOT
   ============================================================ */
function lmsg(txt,ok){
  var m=$('#loginMsg'); m.textContent=txt||'';
  m.className='msg'+(txt?' on':'')+(ok?' ok':'');
}
function deviceId(){
  var k=LSK+'device', v=localStorage.getItem(k);
  if(!v){ v='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); try{localStorage.setItem(k,v)}catch(e){} }
  return v;
}
function loginStep(n){
  $('#step1').style.display = n===1?'block':'none';
  $('#step2').style.display = n===2?'block':'none';
  $('#loginCfg').style.display = (n===1 && !API_URL)?'block':'none';
}
function drawLogin(){
  var box=$('#loginCfgBox'), go=$('#loginGo');
  loginStep(1);
  $('#loginUrl').value=apiUrl();
  $('#loginCfg').onclick=function(){ box.style.display = box.style.display==='none'?'block':'none' };
  $('#loginUrlSave').onclick=function(){
    var u=$('#loginUrl').value.trim();
    localStorage.setItem(LSK+'apiUrl',u);
    if(!u){ lmsg('Server URL cleared.'); return }
    lmsg('Checking server…', true);
    api('apiPing',[]).then(function(){ lmsg('Server connected. You can sign in now.', true); box.style.display='none' })
      .catch(function(e){ lmsg(e.message) });
  };
  if(API_URL){ $('#loginCfg').style.display='none'; box.style.display='none' }
  else if(!apiUrl()) box.style.display='block';
  var peek=$('#loginPeek');
  peek.onclick=function(){
    var i=$('#loginPin'), hid=i.type==='password';
    i.type = hid?'text':'password'; peek.textContent = hid?'Hide':'Show'; i.focus();
  };
  go.onclick=function(){
    var email=($('#loginEmail').value||'').trim().toLowerCase(), pw=$('#loginPin').value||'';
    if(!email || !pw) return lmsg('Enter your email and password.');
    if(!apiUrl()){ box.style.display='block'; return lmsg('Add the server URL below first.') }
    sendLogin(email, pw);
  };
  function sendLogin(email, pw){
    S.pending={email:email, pw:pw};
    lmsg('Signing in…', true); go.disabled=true; go.textContent='Signing in…';
    api('apiLogin',[email,pw,deviceId()]).then(function(d){
      $('#loginPin').value='';
      if(d && d.needCode){
        lmsg('');
        $('#codeTo').textContent = 'We sent a 6-digit code to ' + d.email + '. It expires in ' + (d.minutes||10) + ' minutes.';
        $('#loginCode').value='';
        loginStep(2);
        setTimeout(function(){ try{ $('#loginCode').focus() }catch(e){} },100);
        return;
      }
      S.token=d.token; localStorage.setItem(LSK+'token',d.token); lmsg('');
      setMe({email:email, name:d.name, role:d.role});
    }).catch(function(e){ lmsg(e.message) })
      .then(function(){ go.disabled=false; go.textContent='Sign in' });
  }

  var cgo=$('#codeGo');
  cgo.onclick=function(){
    var code=($('#loginCode').value||'').trim();
    if(code.length<6) return lmsg('Enter the 6-digit code from your email.');
    if(!S.pending) return loginStep(1);
    lmsg('Checking the code…', true); cgo.disabled=true; cgo.textContent='Checking…';
    api('apiVerifyCode',[S.pending.email, code, deviceId(), true]).then(function(d){
      S.token=d.token; localStorage.setItem(LSK+'token',d.token); lmsg('');
      var em=S.pending.email; S.pending=null;
      setMe({email:em, name:d.name, role:d.role});
    }).catch(function(e){ lmsg(e.message) })
      .then(function(){ cgo.disabled=false; cgo.textContent='Verify' });
  };
  $('#loginCode').onkeydown=function(e){ if(e.key==='Enter') cgo.click() };
  $('#codeResend').onclick=function(){ if(S.pending) sendLogin(S.pending.email, S.pending.pw) };
  $('#codeBack').onclick=function(){ S.pending=null; lmsg(''); loginStep(1) };
  $('#loginEmail').onkeydown=$('#loginPin').onkeydown=function(e){ if(e.key==='Enter') $('#loginGo').click() };
  $('#login').classList.add('on');
}
function setMe(me){
  S.me=me; ls('me',me); $('#login').classList.remove('on');
  if(S.owner===undefined) S.owner='';
  if(window.__native) window.__native.push(me.email);
  render(); refresh(true).then(checkReminders);
}
window.__refreshNow=function(){ if(S.me) refresh(true) };
function boot(){
  S.token=localStorage.getItem(LSK+'token')||null;
  var me=ls('me');
  loadLocal();
  if(me && me.email){ setMe(me) } else { drawLogin() }
  var tabs=document.querySelectorAll('nav.tabs button');
  for(var i=0;i<tabs.length;i++) tabs[i].onclick=(function(t){ return function(){ S.tab=t; render(); window.scrollTo(0,0) } })(tabs[i].dataset.tab);
  $('#goSet').onclick=function(){ S.tab='set'; render(); window.scrollTo(0,0) };
  markSync(false);
  if(online()) api('apiPing',[]).then(function(){markSync(true)}).catch(function(){});
  setInterval(function(){ if(!document.hidden){ refresh(true); checkReminders() } }, 60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ refresh(true); checkReminders() } });
  var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if(!native && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});
}
boot();
