<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSC Dashboard</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0F3D3E; }
  iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
<script>
  /* ================================================================
     ការការពារទី ១ ៖ FRAME-BUSTING
     ទំព័រនេះកាន់ token របស់អ្នកប្រើ។ បើគេហទំព័រណាមួយដាក់ទំព័រនេះក្នុង
     iframe របស់វា នោះ window.top របស់ទំព័រ Login ខាងក្នុងនឹងក្លាយជា
     ទំព័ររបស់អ្នកវាយប្រហារ — ហើយ token ធ្លាក់ទៅដៃគេ។ ដូច្នេះបើយើងមិន
     មែននៅកម្រិតលើគេ ត្រូវផ្ទុះចេញភ្លាម មុនពេល iframe ត្រូវបានបង្កើត។
     ================================================================ */
  if (window.top !== window.self) {
    try { window.top.location = window.self.location.href; }
    catch (e) { document.write('ទំព័រនេះមិនអនុញ្ញាតឲ្យបើកក្នុង frame ទេ។'); }
    throw new Error('framed');
  }
</script>

  <!-- សំខាន់ ៖ URL នេះត្រូវតែដូចនឹង "Web app" deployment URL របស់ Apps
       Script (Deploy > Manage deployments > Web app)។ វាប្តូរតែពេលអ្នក
       បង្កើត deployment ថ្មីទាំងស្រុងប៉ុណ្ណោះ មិនមែនពេល "New version" ទេ។ -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzLnWeB05H8oqWAtM1hiw_FdYunlns01NkHR4MjsY5QbiT3Xuh-xdSDzKIuIYbB33k0/exec"
    allow="clipboard-write"
    referrerpolicy="no-referrer"
  ></iframe>

<script>
  /* ================================================================
     ការការពារទី ២ ៖ ទទួល token តែពី Google ប៉ុណ្ណោះ

     ចំណាំសំខាន់អំពីរបៀបដែល Apps Script ដំណើរការ ៖
     វាមិនរត់ HTML របស់យើងនៅលើ script.google.com ទេ។ វាដាក់វាក្នុង
     iframe ជាន់ទីពីរនៅលើ domain sandbox n-xxxxx....googleusercontent.com
     ដែលអក្សរខាងមុខប្តូររាល់ deployment និងរាល់វគ្គ។ ដូច្នេះ ៖
       · event.origin  = googleusercontent.com (មិនមែន script.google.com)
       · event.source  = iframe ជាន់ក្នុង (មិនមែន appFrame.contentWindow)
     ការប្រៀបធៀបនឹង script.google.com ត្រង់ៗ ឬនឹង contentWindow នឹង
     ទម្លាក់ token ចោលទាំងអស់ — នេះជាមូលហេតុដែលការចុចប៊ូតុងគ្មានប្រតិកម្ម។
     ដូច្នេះយើងផ្ទៀងផ្ទាត់តាម pattern របស់ domain វិញ ដែលនៅតែបិទផ្លូវ
     គេហទំព័រខាងក្រៅដដែល។
     ================================================================ */
  var GOOGLE_ORIGIN = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/;

  var frame = document.getElementById('appFrame');
  var BASE_URL = frame.src.split('?')[0];

  window.addEventListener('message', function (event) {
    /* ១. ត្រូវមកពី domain របស់ Google ពិត */
    if (!GOOGLE_ORIGIN.test(event.origin)) return;

    var data = event.data;
    if (!data) return;

    /* ចាកចេញ ៖ Dashboard ប្រាប់មក ហើយយើងកំណត់ iframe ត្រលប់ទៅទំព័រចូល
       ដោយគ្មាន token — address bar នៅជា teamsmos.com ដដែល។ */
    /* ឆ្លើយតបបញ្ជាក់ជានិច្ច ៖ ទំព័រខាងក្នុងត្រូវដឹងច្បាស់ថាមាន wrapper
       ដើម្បីកុំអោយវាបើកទំព័រដោយខ្លួនឯង ហើយអូស address bar ចេញពី
       domain នេះ។ ការទាយតាមពេលវេលាមិនគ្រប់គ្រាន់ទេ ព្រោះ Apps Script
       ប្រើពេលច្រើនជាងមួយវិនាទីដើម្បីផ្ទុក iframe ថ្មី។ */
    function ack() {
      try { event.source.postMessage({ type: 'rsc-wrapper-ack' }, event.origin); } catch (e) {}
    }

    if (data.type === 'rsc-dashboard-logout') { ack(); frame.src = BASE_URL; return; }

    /* ផ្ទុកឡើងវិញដោយរក្សា token ដដែល (ប្រើក្រោយ «លុបទិន្នន័យទាំងអស់») ៖
       ការកំណត់ src ជាតម្លៃដដែលបង្ខំអោយ iframe ផ្ទុកឡើងវិញ។ */
    if (data.type === 'rsc-dashboard-reload') { ack(); frame.src = frame.src; return; }

    if (data.type !== 'rsc-dashboard-token' || !data.token) return;
    ack();

    /* ២. Token ជា UUID — បដិសេធអ្វីដែលមិនមែនរូបរាងនោះ */
    if (!/^[0-9a-fA-F-]{20,64}$/.test(String(data.token))) return;

    /* ៣. Login.html ផ្ញើ token ពីរដង ៖ ម្តងស្វ័យប្រវត្តិពេលទំព័រផ្ទុក និង
          ម្តងទៀតពេលអ្នកប្រើចុចប៊ូតុង។ ដូច្នេះកុំកំណត់អោយប្តូរតែម្តង។ */
    var next = BASE_URL + '?token=' + encodeURIComponent(data.token);
    if (frame.src === next) return;   // token ដដែល — គ្មានអ្វីត្រូវធ្វើ
    frame.src = next;
  }, false);
</script>
</body>
</html>
